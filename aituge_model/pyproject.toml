[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aituge-model"
version = "0.2.0"
description = "Shared model registry and resilient internal model gateway"
requires-python = ">=3.11"
dependencies = ["pyyaml==6.0.3"]

[project.optional-dependencies]
gateway = [
  "aiohttp==3.14.3",
  "dnspython==2.8.0",
  "redis==6.4.0",
  "tenacity==9.1.4",
]

[tool.setuptools]
packages = ["aituge_model", "aituge_model.config", "aituge_model.gateway"]
package-dir = { aituge_model = "." }
include-package-data = false

[tool.setuptools.package-data]
"aituge_model.config" = ["*.yaml", "packs/*.yaml", "secrets/README.md"]
