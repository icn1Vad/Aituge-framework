version: 1
default_pack_id: api-rerank
default_speech_recognition_id: aliyun-nls-realtime

speech_recognizers:
  aliyun-nls-realtime:
    mode: api
    provider: aliyun_nls
    model: realtime-speech-recognition
    base_url: wss://nls-gateway.cn-shanghai.aliyuncs.com/ws/v1
    app_key_ref: aliyun_nls_appkey
    access_key_id_ref: aliyun_access_key_id
    access_key_secret_ref: aliyun_access_key_secret
    token_ref: aliyun_nls_token
    region: cn-shanghai
    meta_endpoint: nls-meta.cn-shanghai.aliyuncs.com
    audio_format: pcm
    sample_rate: 16000
    channels: 1
    recommended_chunk_ms: 20

llms:
  qwen3-vl-plus:
    mode: api
    provider: openai_compatible
    model: qwen3-vl-plus
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    credential_ref: dashscope_api_key
    context_window: 128000
    max_tokens: 8000
    temperature: 0.1
    enable_thinking: false
    vision_support: true

  deepseek-v4-flash:
    mode: api
    provider: deepseek
    model: deepseek-v4-flash
    base_url: https://api.deepseek.com
    credential_ref: deepseek_api_key
    context_window: 110000
    max_tokens: 8000
    temperature: 0.1
    enable_thinking: false
    vision_support: false

  local-qwen3-30b-q5:
    mode: local
    provider: openai_compatible
    model: qwen3-30b-a3b-q5_k_m
    base_url: http://qwen-main-service:11434/v1
    context_window: 32768
    max_tokens: 8000
    temperature: 0.1
    enable_thinking: false
    vision_support: false

embeddings:
  policy-embedding-v4:
    mode: api
    provider: dashscope
    model: text-embedding-v4
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    dimensions: 1024
    credential_ref: dashscope_api_key
    timeout_seconds: 30

  local-qwen3-embedding-8b:
    mode: local
    provider: openai_compatible
    model: qwen3-embedding:8b
    base_url: http://qwen-embedding-service:18081/v1
    dimensions: 4096
    timeout_seconds: 30

rerankers:
  api-qwen3-rerank:
    mode: api
    provider: dashscope
    model: qwen3-rerank
    base_url: https://dashscope.aliyuncs.com/compatible-api/v1/reranks
    credential_ref: dashscope_api_key
    timeout_seconds: 30
    instruction: Given a web search query, retrieve relevant passages that answer the query.

  api-qwen3-rerank-similarity:
    mode: api
    provider: dashscope
    model: qwen3-rerank
    base_url: https://dashscope.aliyuncs.com/compatible-api/v1/reranks
    credential_ref: dashscope_api_key
    timeout_seconds: 30
    instruction: Retrieve semantically similar text.

  local-qwen3-rerank:
    mode: local
    provider: openai_compatible
    model: qwen3-reranker-8b
    base_url: http://qwen-reranker-service:18082/v1/rerank
    timeout_seconds: 30
    instruction: Given a web search query, retrieve relevant passages that answer the query.
