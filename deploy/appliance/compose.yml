name: ai-framework

services:
  postgres:
    image: ai-framework-postgres:pg16-vector0.8.5-jieba1.1.1
    build:
      context: ../../infrastructure/postgres
      network: host
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=${POSTGRES_MAX_CONNECTIONS:-150}"]
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-15432}:5432"
    volumes:
      - ${AI_FRAMEWORK_RUNTIME_ROOT:-../../runtime}/postgres:/var/lib/postgresql/data
      - ../../infrastructure/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - ai_internal

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${REDIS_PORT:-16379}:6379"
    volumes:
      - ${AI_FRAMEWORK_RUNTIME_ROOT:-../../runtime}/redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks:
      - ai_internal

  model-gateway:
    image: ai-framework-model-gateway:local
    build:
      context: ../..
      dockerfile: deploy/appliance/model-gateway.Dockerfile
      network: host
    restart: unless-stopped
    environment:
      MODEL_CONFIG_DIR: /app/aituge_model/config
      MODEL_SECRET_DIR: /app/aituge_model/config/secrets
      MODEL_GATEWAY_TOKEN: ${MODEL_GATEWAY_TOKEN}
      MODEL_GATEWAY_REDIS_HOST: redis
      MODEL_GATEWAY_REDIS_PORT: "6379"
      MODEL_GATEWAY_REDIS_PASSWORD: ${REDIS_PASSWORD}
      MODEL_GATEWAY_REDIS_DB: "0"
      MODEL_GATEWAY_FALLBACK_DNS: ${MODEL_GATEWAY_FALLBACK_DNS:-223.5.5.5,223.6.6.6}
      MODEL_GATEWAY_DNS_TTL_SECONDS: ${MODEL_GATEWAY_DNS_TTL_SECONDS:-60}
      MODEL_GATEWAY_CONNECT_TIMEOUT_SECONDS: ${MODEL_GATEWAY_CONNECT_TIMEOUT_SECONDS:-5}
      MODEL_GATEWAY_STREAM_IDLE_TIMEOUT_SECONDS: ${MODEL_GATEWAY_STREAM_IDLE_TIMEOUT_SECONDS:-30}
      MODEL_GATEWAY_MAX_ATTEMPTS: ${MODEL_GATEWAY_MAX_ATTEMPTS:-3}
      MODEL_GATEWAY_CIRCUIT_FAILURE_THRESHOLD: ${MODEL_GATEWAY_CIRCUIT_FAILURE_THRESHOLD:-5}
      MODEL_GATEWAY_CIRCUIT_OPEN_SECONDS: ${MODEL_GATEWAY_CIRCUIT_OPEN_SECONDS:-30}
    ports:
      - "127.0.0.1:${MODEL_GATEWAY_PORT:-18300}:18300"
    volumes:
      - ../../aituge_model/config/secrets:/app/aituge_model/config/secrets:ro
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18300/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - ai_internal
      - model_runtime

  proof:
    image: ai-framework-proof:local
    build:
      context: ../..
      dockerfile: deploy/appliance/proof.Dockerfile
      network: host
    restart: unless-stopped
    env_file:
      - ${PROOF_ENV_FILE:-proof.env}
    environment:
      MODEL_CONFIG_DIR: /aituge_model/config
      MODEL_GATEWAY_URL: http://model-gateway:18300
      MODEL_GATEWAY_TOKEN: ${MODEL_GATEWAY_TOKEN}
      MODEL_PACK_ID: ${MODEL_PACK_ID:-api-rerank}
      MODEL_PACK_PUBLIC_ID: ${MODEL_PACK_PUBLIC_ID:-api-rerank}
      MODEL_PACK_PRIVATE_ID: ${MODEL_PACK_PRIVATE_ID:-api-rerank-similarity}
      PROOF_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/proofreading
      PROOF_STORAGE_ROOT: /app/.proof-data
      PROOF_SEMANTIC_AUDIT_ENABLED: ${PROOF_SEMANTIC_AUDIT_ENABLED:-false}
      PROOF_FRAMEWORK_BASE_URL: http://framework:8894
      PROOF_FRAMEWORK_USER_ID: ${PROOF_FRAMEWORK_USER_ID:-proof-service}
      PROOF_AUDIT_BATCH_MAX_CHARS: ${PROOF_AUDIT_BATCH_MAX_CHARS:-6000}
      PROOF_AUDIT_BATCH_MAX_CHUNKS: ${PROOF_AUDIT_BATCH_MAX_CHUNKS:-8}
      PROOF_AUDIT_MAX_CHUNK_CHARS: ${PROOF_AUDIT_MAX_CHUNK_CHARS:-12000}
      PROOF_AUDIT_MAX_CONCURRENCY: ${PROOF_AUDIT_MAX_CONCURRENCY:-4}
    ports:
      - "${PROOF_BIND_ADDRESS:-0.0.0.0}:${PROOF_PORT:-18100}:18100"
    volumes:
      - ${AI_FRAMEWORK_RUNTIME_ROOT:-../../runtime}/proof-data:/app/.proof-data
    depends_on:
      postgres:
        condition: service_healthy
      model-gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18100/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      ai_internal:
      proofspace:
        aliases:
          - ai-proof
      model_runtime:

  qianxuesen-mentor:
    image: ai-framework-qianxuesen-mentor:local
    build:
      context: ../..
      dockerfile: deploy/appliance/qianxuesen-mentor.Dockerfile
      network: host
    restart: unless-stopped
    environment:
      MODEL_CONFIG_DIR: /aituge_model/config
      MODEL_GATEWAY_URL: http://model-gateway:18300
      MODEL_GATEWAY_TOKEN: ${MODEL_GATEWAY_TOKEN}
      MODEL_PACK_ID: ${MODEL_PACK_ID:-api-rerank}
      QXS_MODEL_PACK_ID: ${MODEL_PACK_ID:-api-rerank}
      QXS_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/proofreading
      QXS_CORPUS_ROOT: /app/corpus
      QXS_STORAGE_ROOT: /app/.qxs-data
      QXS_OCR_ENABLED: ${QXS_OCR_ENABLED:-false}
    ports:
      - "${QXS_BIND_ADDRESS:-0.0.0.0}:${QXS_PORT:-18400}:18400"
    volumes:
      - ${AI_FRAMEWORK_RUNTIME_ROOT:-../../runtime}/qianxuesen-mentor-data:/app/.qxs-data
      - ${QXS_CORPUS_ROOT:-../../../../钱学森导师智能体}:/app/corpus:ro
    depends_on:
      postgres:
        condition: service_healthy
      model-gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18400/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      ai_internal:
      proofspace:
        aliases:
          - ai-qianxuesen-mentor
      model_runtime:

  qianxuesen-mentor-ocr:
    profiles: ["qxs-ocr"]
    image: ai-framework-qianxuesen-mentor-ocr:local
    build:
      context: ../..
      dockerfile: deploy/appliance/qianxuesen-mentor-ocr.Dockerfile
      network: host
    environment:
      QXS_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/proofreading
      QXS_CORPUS_ROOT: /app/corpus
      QXS_STORAGE_ROOT: /app/.qxs-data
      QXS_OCR_ENABLED: "true"
      QXS_OCR_DEVICE: ${QXS_OCR_DEVICE:-cpu}
      QXS_OCR_FORMULA_ENABLED: ${QXS_OCR_FORMULA_ENABLED:-false}
    volumes:
      - ${AI_FRAMEWORK_RUNTIME_ROOT:-../../runtime}/qianxuesen-mentor-data:/app/.qxs-data
      - ${QXS_CORPUS_ROOT:-../../../../钱学森导师智能体}:/app/corpus:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ai_internal

  smoke:
    image: ai-framework-smoke:local
    build:
      context: ../..
      dockerfile: deploy/appliance/smoke.Dockerfile
      network: host
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SMOKE_PORT:-18200}:18200"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18200/health', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - ai_internal

  ai-contract:
    image: ai-framework-contract:local
    build:
      context: ../..
      dockerfile: services/contract/Dockerfile
      target: runtime
      network: host
    restart: unless-stopped
    environment:
      MODEL_CONFIG_DIR: /aituge_model/config
      MODEL_GATEWAY_URL: http://model-gateway:18300
      MODEL_GATEWAY_TOKEN: ${MODEL_GATEWAY_TOKEN}
      CONTRACT_DATABASE_MAX_CONNECTIONS: ${CONTRACT_DATABASE_MAX_CONNECTIONS:-5}
      CONTRACT_DATABASE_CONNECTION_ACQUIRE_TIMEOUT_SECONDS: ${CONTRACT_DATABASE_CONNECTION_ACQUIRE_TIMEOUT_SECONDS:-30}
      CONTRACT_DATABASE_APPLICATION_NAME: ai-contract
      CONTRACT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/contract_review
      CONTRACT_DATA_DIR: /app/data/contract
      CONTRACT_MAX_FILE_SIZE: ${CONTRACT_MAX_FILE_SIZE:-26214400}
      CONTRACT_SCHEMA_VERSION: ${CONTRACT_SCHEMA_VERSION:-1.0}
      CONTRACT_INTERNAL_AUTH_ENABLED: "true"
      CONTRACT_INTERNAL_TOKEN: ${CONTRACT_INTERNAL_TOKEN}
      FRAMEWORK_BASE_URL: http://framework:8894
      FRAMEWORK_CONNECT_TIMEOUT_SECONDS: ${FRAMEWORK_CONNECT_TIMEOUT_SECONDS:-5}
      FRAMEWORK_READ_TIMEOUT_SECONDS: ${FRAMEWORK_READ_TIMEOUT_SECONDS:-30}
      FRAMEWORK_CANCEL_WAIT_SECONDS: ${FRAMEWORK_CANCEL_WAIT_SECONDS:-5}
      FRAMEWORK_STAGE_TIMEOUT_SECONDS: ${FRAMEWORK_STAGE_TIMEOUT_SECONDS:-1800}
      FRAMEWORK_RECOVERY_GRACE_SECONDS: ${FRAMEWORK_RECOVERY_GRACE_SECONDS:-120}
      FRAMEWORK_RESULT_SINK_INTERNAL_TOKEN: ${FRAMEWORK_RESULT_SINK_INTERNAL_TOKEN}
      CONTRACT_MOCK_MODE: "false"
      PYTHONUNBUFFERED: "1"
    volumes:
      - contract_data:/app/data/contract
    depends_on:
      postgres:
        condition: service_healthy
      framework:
        condition: service_healthy
      model-gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18200/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      ai_internal:
      agent_internal:
        aliases:
          - ai-contract

  framework:
    image: ai-framework-core:local
    build:
      context: ../..
      dockerfile: deploy/appliance/framework.runtime.Dockerfile
      network: host
    restart: unless-stopped
    environment: &framework_environment
      DB_TYPE: postgresql
      DB_NAME: ${CONTRACT_POSTGRES_DB:-contract_review}
      DB_POOL_SIZE: ${FRAMEWORK_API_DB_POOL_SIZE:-3}
      DB_MAX_OVERFLOW: ${FRAMEWORK_API_DB_MAX_OVERFLOW:-2}
      DB_POOL_TIMEOUT_SECONDS: ${FRAMEWORK_API_DB_POOL_TIMEOUT_SECONDS:-30}
      DB_APPLICATION_NAME: framework-api
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      TASK_TENANT_CONCURRENCY: ${TASK_TENANT_CONCURRENCY:-10}
      TASK_WORKER_LEASE_SECONDS: ${TASK_WORKER_LEASE_SECONDS:-120}
      TASK_WORKER_HEARTBEAT_SECONDS: ${TASK_WORKER_HEARTBEAT_SECONDS:-30}
      TASK_WORKER_POLL_SECONDS: ${TASK_WORKER_POLL_SECONDS:-1}
      TASK_EVENT_BROKER: redis
      TASK_EXECUTOR_LOCK_BACKEND: redis
      AITUGE_CAPABILITY_ENTRIES: '["/opt/proof-capabilities/register.py","/opt/smoke-capabilities/register.py","/opt/contract-capabilities/register.py","/opt/qianxuesen-mentor-capabilities/register.py"]'
      PROOF_SERVICE_BASE_URL: http://proof:18100
      QXS_SERVICE_BASE_URL: http://qianxuesen-mentor:18400
      SMOKE_SERVICE_BASE_URL: http://smoke:18200
      CONTRACT_SERVICE_BASE_URL: http://ai-contract:18200
      MODEL_CONFIG_DIR: /app/aituge_model/config
      MODEL_GATEWAY_URL: http://model-gateway:18300
      MODEL_GATEWAY_TOKEN: ${MODEL_GATEWAY_TOKEN}
      MODEL_PACK_ID: ${MODEL_PACK_ID:-api-rerank}
      MODEL_PACK_PUBLIC_ID: ${MODEL_PACK_PUBLIC_ID:-api-rerank}
      MODEL_PACK_PRIVATE_ID: ${MODEL_PACK_PRIVATE_ID:-api-rerank-similarity}
      CONTRACT_EMBEDDED_ENABLED: "false"
      CONTRACT_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/contract_review
      CONTRACT_DATA_DIR: /app/data/contract
      CONTRACT_MAX_FILE_SIZE: ${CONTRACT_MAX_FILE_SIZE:-26214400}
      CONTRACT_SCHEMA_VERSION: ${CONTRACT_SCHEMA_VERSION:-1.0}
      CONTRACT_INTERNAL_AUTH_ENABLED: "true"
      CONTRACT_INTERNAL_TOKEN: ${CONTRACT_INTERNAL_TOKEN}
      FRAMEWORK_BASE_URL: http://framework:8894
      FRAMEWORK_CONNECT_TIMEOUT_SECONDS: ${FRAMEWORK_CONNECT_TIMEOUT_SECONDS:-5}
      FRAMEWORK_READ_TIMEOUT_SECONDS: ${FRAMEWORK_READ_TIMEOUT_SECONDS:-30}
      FRAMEWORK_CANCEL_WAIT_SECONDS: ${FRAMEWORK_CANCEL_WAIT_SECONDS:-5}
      FRAMEWORK_STAGE_TIMEOUT_SECONDS: ${FRAMEWORK_STAGE_TIMEOUT_SECONDS:-1800}
      FRAMEWORK_RECOVERY_GRACE_SECONDS: ${FRAMEWORK_RECOVERY_GRACE_SECONDS:-120}
      FRAMEWORK_RESULT_SINK_INTERNAL_TOKEN: ${FRAMEWORK_RESULT_SINK_INTERNAL_TOKEN}
      CONTRACT_RESULT_SINK_INTERNAL_TOKEN: ${CONTRACT_RESULT_SINK_INTERNAL_TOKEN}
      CONTRACT_MOCK_MODE: "false"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DB: "0"
      PYTHONUNBUFFERED: "1"
      AITUGE_TMP_ROOT: /app/aituge-tmp
    ports:
      - "${FRAMEWORK_BIND_ADDRESS:-0.0.0.0}:${FRAMEWORK_PORT:-8894}:8894"
    volumes:
      - ${AI_FRAMEWORK_RUNTIME_ROOT:-../../runtime}/framework:/app/runtime
      - ${AITUGE_TMP_ROOT:-../../../tmp}:/app/aituge-tmp
      - contract_data:/app/data/contract
      - ../../services/proof/capabilities:/opt/proof-capabilities:ro
      - ../../services/smoke/capabilities:/opt/smoke-capabilities:ro
      - ../../services/contract/capabilities:/opt/contract-capabilities:ro
      - ../../services/qianxuesen-mentor/capabilities:/opt/qianxuesen-mentor-capabilities:ro
    depends_on:
      proof:
        condition: service_healthy
      qianxuesen-mentor:
        condition: service_healthy
      smoke:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      model-gateway:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8894/openapi.json', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      ai_internal:
      proofspace:
        aliases:
          - ai-framework
      agent_internal:
        aliases:
          - ai-framework
      model_runtime:

  framework-worker:
    image: ai-framework-core:local
    restart: unless-stopped
    command: ["python", "-m", "task_manager.runtime.worker"]
    environment:
      <<: *framework_environment
      DB_POOL_SIZE: ${FRAMEWORK_WORKER_DB_POOL_SIZE:-3}
      DB_MAX_OVERFLOW: ${FRAMEWORK_WORKER_DB_MAX_OVERFLOW:-1}
      DB_POOL_TIMEOUT_SECONDS: ${FRAMEWORK_WORKER_DB_POOL_TIMEOUT_SECONDS:-30}
      DB_APPLICATION_NAME: framework-worker
    volumes:
      - ${AI_FRAMEWORK_RUNTIME_ROOT:-../../runtime}/framework:/app/runtime
      - ${AITUGE_TMP_ROOT:-../../../tmp}:/app/aituge-tmp
      - contract_data:/app/data/contract
      - ../../services/proof/capabilities:/opt/proof-capabilities:ro
      - ../../services/smoke/capabilities:/opt/smoke-capabilities:ro
      - ../../services/contract/capabilities:/opt/contract-capabilities:ro
      - ../../services/qianxuesen-mentor/capabilities:/opt/qianxuesen-mentor-capabilities:ro
    depends_on:
      framework:
        condition: service_healthy
      ai-contract:
        condition: service_healthy
      proof:
        condition: service_healthy
      qianxuesen-mentor:
        condition: service_healthy
      smoke:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: ${FRAMEWORK_WORKER_REPLICAS:-20}
    networks:
      - ai_internal
      - proofspace
      - agent_internal
      - model_runtime

networks:
  ai_internal:
    name: ai-framework-internal
  proofspace:
    external: true
    name: proofspace-network
  agent_internal:
    external: true
    name: agent-internal
  model_runtime:
    external: true
    name: ${AI_MODEL_RUNTIME_NETWORK:-ai-model-runtime-net}

volumes:
  contract_data:
    name: ai-framework-contract-data
