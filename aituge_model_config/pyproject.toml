[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aituge-model-config"
version = "0.1.0"
description = "Shared typed model component, model-pack registry, and runtime provider"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6,<7"]

[tool.setuptools]
packages = ["aituge_model_config"]
package-dir = { aituge_model_config = "." }

[tool.setuptools.package-data]
aituge_model_config = ["*.yaml", "packs/*.yaml", "secrets/README.md"]
