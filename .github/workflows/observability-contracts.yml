name: Observability semantic contracts

on:
  pull_request:
    paths:
      - "docs/observability/1.5/**"
      - "tests/observability_contracts/**"
      - "scripts/observability-contracts/**"
      - ".github/workflows/observability-contracts.yml"
  push:
    branches:
      - v.concurrent
      - "obs/**"
    paths:
      - "docs/observability/1.5/**"
      - "tests/observability_contracts/**"
      - "scripts/observability-contracts/**"
      - ".github/workflows/observability-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12.11"

      - name: Install fixed test dependencies
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check "pip==25.0.1"
          python -m pip install --disable-pip-version-check --no-deps "pytest==8.4.1" "PyYAML==6.0.2" "iniconfig==2.1.0" "packaging==25.0" "pluggy==1.6.0" "Pygments==2.19.2" "ruff==0.12.7"

      - name: Validate scripts
        shell: bash
        run: bash -n scripts/observability-contracts/*.sh

      - name: Run no-Docker safety guards
        shell: bash
        run: |
          scripts/observability-contracts/verify-frozen-contract-source.sh
          scripts/observability-contracts/test-frozen-contract-source-safety.sh
          scripts/observability-contracts/test-runner-resource-safety.sh
          scripts/observability-contracts/test-e2e-guard-safety.sh
          scripts/observability-contracts/test-e2e-probe-safety.sh
          scripts/observability-contracts/test-e2e-secret-safety.sh
          scripts/observability-contracts/test-capability-leak-scanner.sh

      - name: Run Python lint and format checks
        shell: bash
        run: |
          python -m ruff check --no-cache tests/observability_contracts
          python -m ruff format --check --no-cache tests/observability_contracts

      - name: Run semantic contract suite
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest \
            --confcutdir=tests/observability_contracts \
            -p no:cacheprovider \
            --strict-markers \
            -q \
            tests/observability_contracts
