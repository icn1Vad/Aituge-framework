[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "contract-ocr"
version = "0.1.0"
description = "Isolated PaddleOCR runtime for contract scan preprocessing."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "paddleocr[doc-parser]==3.7.0",
  "paddlepaddle==3.3.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/contract_ocr"]
