[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "contract-ocr"
version = "0.3.0"
description = "Isolated PaddleOCR runtime for contract scan preprocessing."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "paddleocr[doc-parser]==3.7.0",
  # 3.3.x has a known CPU oneDNN/PIR regression in PP-StructureV3 inference.
  "paddlepaddle==3.2.2",
  "pypdf>=5,<7",
  "pypdfium2>=5,<6",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/contract_ocr"]
