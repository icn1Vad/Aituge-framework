[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aituge-qianxuesen-mentor"
version = "0.1.0"
description = "Qian Xuesen mentor corpus, retrieval, and capability service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aituge-model",
  "fastapi>=0.115,<1",
  "httpx[socks]>=0.27,<1",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.4,<3",
  "pypdf>=5,<7",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv.sources]
aituge-model = { path = "../../aituge_model" }

[tool.hatch.build.targets.wheel]
packages = ["src/qianxuesen_mentor"]

[tool.pytest.ini_options]
pythonpath = ["src", "../.."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
