<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>合同 IR Window 阶段验收</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Microsoft YaHei", sans-serif; background:#0b1020; color:#e8eefc; }
    * { box-sizing:border-box; }
    body { margin:0; }
    main { max-width:1280px; margin:auto; padding:28px; }
    h1 { margin:0 0 8px; font-size:28px; }
    .hint { color:#99a8c7; margin-bottom:22px; }
    .panel { background:#131b30; border:1px solid #273454; border-radius:14px; padding:18px; margin-bottom:18px; }
    .upload { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    input, button { border-radius:9px; border:1px solid #34456e; padding:10px 13px; background:#0d1528; color:#e8eefc; }
    button { background:#2867e8; border-color:#2867e8; cursor:pointer; font-weight:650; }
    button:disabled { opacity:.55; cursor:wait; }
    .error { color:#ff9eaa; white-space:pre-wrap; }
    .metrics { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
    .metric { background:#0d1528; border-radius:10px; padding:13px; }
    .metric span { color:#94a3c4; display:block; font-size:12px; margin-bottom:4px; }
    .good { color:#64e8a7; }
    .tabs { display:flex; gap:8px; margin:18px 0 10px; }
    .tabs button { background:#16213b; border-color:#34456e; }
    .tabs button.active { background:#2867e8; }
    .list { display:grid; gap:10px; }
    details { border:1px solid #2a385b; background:#0e172a; border-radius:10px; padding:12px; }
    summary { cursor:pointer; font-weight:650; }
    .meta { color:#9cadce; font-size:13px; margin:8px 0; word-break:break-all; }
    .extract { margin:10px 0; }
    .extract-result { border-left:3px solid #2867e8; margin-top:10px; padding-left:12px; }
    .extraction { background:#111d35; border-radius:8px; padding:10px; margin:8px 0; }
    pre { white-space:pre-wrap; word-break:break-word; background:#080e1a; border-radius:8px; padding:12px; max-height:420px; overflow:auto; }
    code { color:#b9ccff; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
<main>
  <h1>合同 IR Window 阶段验收</h1>
  <div class="hint">阶段三验证：文件解析 → Section/Window → 并发 10 抽取 → 确定性字面对齐 → IR Mapper → 确定性合并与 Coverage。这里不会写业务数据库，也不会替换正式审查链路。</div>
  <section class="panel upload">
    <input id="file" type="file" accept=".pdf,.docx">
    <button id="run">解析并构建 Window</button>
    <span id="state" class="hint"></span>
  </section>
  <div id="error" class="panel error" hidden></div>
  <section id="result" hidden>
    <div id="metrics" class="panel metrics"></div>
    <section class="panel">
      <button id="extract-all">并发 10 抽取全部 Window 并合并 IR</button>
      <span id="extract-all-state" class="hint"></span>
      <div id="extract-all-result" class="extract-result" hidden></div>
    </section>
    <div class="tabs">
      <button data-tab="sections" class="active">Section Tree</button>
      <button data-tab="windows">Windows</button>
      <button data-tab="raw">完整 JSON</button>
    </div>
    <div id="sections" class="list"></div>
    <div id="windows" class="list" hidden></div>
    <pre id="raw" hidden></pre>
  </section>
</main>
<script>
  const fileInput = document.querySelector('#file');
  const runButton = document.querySelector('#run');
  const state = document.querySelector('#state');
  const errorBox = document.querySelector('#error');
  const result = document.querySelector('#result');
  const extractAllButton = document.querySelector('#extract-all');
  let inspection = null;
  const escapeHtml = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  runButton.addEventListener('click', async () => {
    const file = fileInput.files[0];
    if (!file) { showError('请先选择 PDF 或 DOCX 合同。'); return; }
    runButton.disabled = true; state.textContent = '正在解析…'; errorBox.hidden = true; result.hidden = true;
    const form = new FormData(); form.append('file', file);
    try {
      const response = await fetch('/api/inspect', { method:'POST', body:form });
      const body = await response.json();
      if (!response.ok) throw new Error(typeof body.detail === 'string' ? body.detail : JSON.stringify(body));
      render(body); state.textContent = '完成';
    } catch (error) { showError(error.message); state.textContent = '失败'; }
    finally { runButton.disabled = false; }
  });

  document.querySelectorAll('[data-tab]').forEach(button => button.addEventListener('click', () => {
    document.querySelectorAll('[data-tab]').forEach(item => item.classList.remove('active'));
    button.classList.add('active');
    ['sections','windows','raw'].forEach(id => document.querySelector(`#${id}`).hidden = id !== button.dataset.tab);
  }));

  extractAllButton.addEventListener('click', async () => {
    if (!inspection) return;
    const stateBox = document.querySelector('#extract-all-state');
    const outputBox = document.querySelector('#extract-all-result');
    extractAllButton.disabled = true; stateBox.textContent = ' 全量抽取中…'; outputBox.hidden = true;
    try {
      const response = await fetch('/api/extract-all', {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(inspection)
      });
      const body = await response.json();
      if (!response.ok) {
        renderPipelineFailure(outputBox, body);
        outputBox.hidden = false; stateBox.textContent = ' 失败';
        return;
      }
      const windowRows = body.windows.map(item => `<div class="extraction"><b>Window ${item.sequence_no}</b> · ${item.status} · ${item.mapped_extractions.length} 项<div class="meta">${item.attempts.map(attempt => `第${attempt.attempt_no}次：${attempt.status} / ${attempt.duration_ms}ms`).join('；')}</div></div>`).join('');
      outputBox.innerHTML = `<b>总耗时 ${escapeHtml(body.duration_ms)} ms；模型调用 ${escapeHtml(body.model_call_count)} 次；局部重试 ${escapeHtml(body.retry_count)} 次；IR Hash ${escapeHtml(body.semantic_ir_hash)}</b>` +
        `<div class="meta">Coverage：${body.coverage.valid ? '通过' : '失败'}；并发固定 10；处理 Window ${body.coverage.processed_window_count}/${body.coverage.expected_window_count}</div>` +
        windowRows + `<details><summary>合并后的 Contract IR Delta</summary><pre>${escapeHtml(JSON.stringify(body.semantic_ir, null, 2))}</pre></details>` +
        `<details><summary>完整阶段三 JSON</summary><pre>${escapeHtml(JSON.stringify(body, null, 2))}</pre></details>`;
      outputBox.hidden = false; stateBox.textContent = ' 完成';
    } catch (error) {
      outputBox.innerHTML = `<span class="error">${escapeHtml(error.message)}</span>`;
      outputBox.hidden = false; stateBox.textContent = ' 失败';
    } finally { extractAllButton.disabled = false; }
  });

  function showError(message) { errorBox.textContent = message; errorBox.hidden = false; }
  function renderPipelineFailure(outputBox, body) {
    const error = body?.error || {};
    const details = error.details || {};
    const coverage = details.coverage || {};
    const failedWindows = (details.windows || []).filter(item => item.status === 'FAILED');
    const failedRows = failedWindows.map(item => `<div class="extraction"><b>Window ${escapeHtml(item.sequence_no)} · ${escapeHtml(item.window_id)}</b>` +
      `<div class="meta">${item.attempts.map(attempt => `第${attempt.attempt_no}次：${escapeHtml(attempt.error_code || attempt.status)} / ${attempt.duration_ms}ms<br>${escapeHtml(attempt.error_message || '')}`).join('<br>')}</div></div>`).join('');
    outputBox.innerHTML = `<b class="error">${escapeHtml(error.code || 'PIPELINE_FAILED')}：${escapeHtml(error.message || body?.detail || '抽取失败')}</b>` +
      `<div class="meta">处理 Window ${escapeHtml(coverage.processed_window_count ?? '-')}/${escapeHtml(coverage.expected_window_count ?? '-')}；失败：${escapeHtml((coverage.failed_window_ids || []).join(', ') || '未提供')}</div>` +
      failedRows + `<details><summary>完整错误 JSON</summary><pre>${escapeHtml(JSON.stringify(body, null, 2))}</pre></details>`;
  }
  function render(data) {
    inspection = data;
    result.hidden = false;
    const coverage = data.coverage;
    document.querySelector('#metrics').innerHTML = [
      ['文件', data.filename], ['Block', data.block_count], ['Section', data.section_count],
      ['Window', data.window_count], ['覆盖', `${coverage.covered_block_count}/${coverage.expected_block_count}`],
      ['覆盖校验', coverage.valid ? '<b class="good">通过</b>' : '失败']
    ].map(([name,value]) => `<div class="metric"><span>${escapeHtml(name)}</span>${name === '覆盖校验' ? value : escapeHtml(value)}</div>`).join('');
    document.querySelector('#sections').innerHTML = data.sections.map(section => `
      <details><summary>${section.sequence_no}. ${escapeHtml(section.section_type)} · ${escapeHtml(section.title)}</summary>
      <div class="meta">section_id: ${escapeHtml(section.section_id)}<br>parent: ${escapeHtml(section.parent_section_id)}<br>major: ${escapeHtml(section.major_section_id)}</div>
      <div>Blocks：<code>${escapeHtml(section.block_ids.join(', '))}</code></div>
      <div>子款 Block：<code>${escapeHtml(section.subclause_block_ids.join(', ') || '无')}</code></div></details>`).join('');
    document.querySelector('#windows').innerHTML = data.windows.map(window => `
      <details><summary>Window ${window.sequence_no} · ${window.estimated_tokens} tokens（估算） · ${window.primary_block_ids.length} Blocks</summary>
      <div class="meta">window_id: ${escapeHtml(window.window_id)}<br>clauses: ${escapeHtml(window.clause_nos.join(', ') || '无')}<br>sections: ${escapeHtml(window.section_ids.join(', '))}</div>
      <button class="extract" data-window-index="${window.sequence_no - 1}">用真实模型抽取这个 Window</button>
      <span class="hint" id="extract-state-${window.sequence_no - 1}"></span>
      <div class="extract-result" id="extract-result-${window.sequence_no - 1}" hidden></div>
      <pre>${escapeHtml(window.source_text)}</pre>
      <details><summary>Offset Map（${window.offset_map.length}）</summary><pre>${escapeHtml(JSON.stringify(window.offset_map, null, 2))}</pre></details></details>`).join('');
    document.querySelectorAll('[data-window-index]').forEach(button => button.addEventListener('click', () => extractWindow(Number(button.dataset.windowIndex), button)));
    document.querySelector('#raw').textContent = JSON.stringify(data, null, 2);
  }

  async function extractWindow(index, button) {
    const windowData = inspection?.windows?.[index];
    if (!windowData) return;
    const stateBox = document.querySelector(`#extract-state-${index}`);
    const outputBox = document.querySelector(`#extract-result-${index}`);
    button.disabled = true; stateBox.textContent = ' 模型抽取中…'; outputBox.hidden = true;
    try {
      const response = await fetch('/api/extract-window', {
        method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(windowData)
      });
      const body = await response.json();
      if (!response.ok) throw new Error(body?.error?.message || body?.detail || JSON.stringify(body));
      const items = body.result.extractions;
      outputBox.innerHTML = `<b>耗时 ${escapeHtml(body.duration_ms)} ms，抽取 ${items.length} 项</b>` +
        items.map(item => `<div class="extraction"><b>${escapeHtml(item.extraction_class)}</b> · ${escapeHtml(item.subject || '无主体')} · ${escapeHtml(item.predicate || item.term || '')}<br>${escapeHtml(item.extraction_text)}<div class="meta">Window字符：[${item.rendered_char_start}, ${item.rendered_char_end})<br>Block溯源：${escapeHtml(item.source_spans.map(span => `${span.block_id}[${span.block_char_start},${span.block_char_end})`).join('；'))}</div></div>`).join('') +
        `<details><summary>完整抽取 JSON</summary><pre>${escapeHtml(JSON.stringify(body, null, 2))}</pre></details>`;
      outputBox.hidden = false; stateBox.textContent = ' 完成';
    } catch (error) {
      outputBox.innerHTML = `<span class="error">${escapeHtml(error.message)}</span>`;
      outputBox.hidden = false; stateBox.textContent = ' 失败';
    } finally { button.disabled = false; }
  }
</script>
</body>
</html>
