[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aituge-contract"
version = "0.1.0"
description = "Contract review technical service for Aituge"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aituge-model",
  # The public OpenAPI document is byte-frozen and consumed by Java. Keep the
  # schema-producing stack exact so a rebuild cannot silently change it.
  "fastapi==0.141.1",
  "httpx>=0.27,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "pypdf>=5,<7",
  "pymysql>=1.1,<2",
  "python-docx>=1.1,<2",
  "python-multipart==0.0.32",
  "starlette==1.6.0",
  "uvicorn[standard]>=0.30,<1",
  "opentelemetry-api>=1.33,<2",
  "opentelemetry-sdk>=1.33,<2",
  "opentelemetry-exporter-otlp-proto-grpc>=1.33,<2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.23,<2",
]

[tool.uv.sources]
aituge-model = { path = "../../aituge_model" }

[tool.hatch.build.targets.wheel]
packages = ["src/contract"]

[tool.pytest.ini_options]
pythonpath = ["src", "../.."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
