[project]
name = "aituge-smoke-service"
version = "0.1.0"
description = "Deterministic HTTP capability used to verify multi-entry Aituge mounts."
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.115.2",
  "pydantic>=2.7.0",
  "uvicorn>=0.31.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
