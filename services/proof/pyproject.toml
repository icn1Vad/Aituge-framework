[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aituge-proof"
version = "0.1.0"
description = "Minimal policy ingestion, clause retrieval, and proof tool service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aituge-model",
  "fastapi>=0.115,<1",
  "httpx[socks]>=0.27,<1",
  "pgvector>=0.3,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.4,<3",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.9,<1",
  "pyyaml>=6,<7",
  "rapidfuzz>=3.14,<4",
  "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[tool.uv.sources]
aituge-model = { path = "../../aituge_model" }

[tool.hatch.build.targets.wheel]
packages = ["src/proof"]

[tool.pytest.ini_options]
pythonpath = ["src", "../.."]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
