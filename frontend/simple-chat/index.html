<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TUGE Chat</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: #162033;
        background: #f5f7fb;
      }
      * { box-sizing: border-box; }
      body { margin: 0; }
      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      .app {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
      }
      aside {
        border-right: 1px solid #dfe4ee;
        background: #fff;
        padding: 22px 18px;
        overflow-y: auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 26px;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        color: #fff;
        background: #5a63e8;
      }
      .panel {
        display: grid;
        gap: 10px;
        padding: 15px 0 20px;
        border-top: 1px solid #edf0f5;
      }
      .panel h2 {
        margin: 0;
        font-size: 13px;
        letter-spacing: .04em;
        color: #697386;
      }
      .field {
        width: 100%;
        border: 1px solid #d9deea;
        border-radius: 9px;
        padding: 9px 10px;
        background: #fff;
      }
      textarea.field { min-height: 86px; resize: vertical; }
      .btn {
        border: 0;
        border-radius: 9px;
        padding: 9px 12px;
        color: #fff;
        background: #5a63e8;
      }
      .btn.secondary { color: #30384a; background: #eef1f7; }
      .status {
        min-height: 20px;
        color: #697386;
        font-size: 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .workspace {
        display: grid;
        grid-template-rows: 64px minmax(0, 1fr) auto;
        min-width: 0;
        height: 100vh;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
        border-bottom: 1px solid #dfe4ee;
        background: rgba(255,255,255,.9);
      }
      .model {
        display: flex;
        gap: 10px;
        align-items: center;
        font-weight: 600;
      }
      #agentSelect { max-width: 240px; }
      .messages {
        overflow-y: auto;
        padding: 30px max(24px, calc((100% - 880px) / 2));
      }
      .empty { color: #8992a4; text-align: center; margin-top: 18vh; }
      .message { display: grid; gap: 5px; margin: 0 0 22px; }
      .message .role { color: #697386; font-size: 12px; font-weight: 700; }
      .message .body {
        padding: 13px 15px;
        border-radius: 13px;
        background: #fff;
        border: 1px solid #e2e6ef;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .message.user .body { background: #eef0ff; border-color: #d9dcff; }
      footer { padding: 16px max(24px, calc((100% - 880px) / 2)) 24px; }
      .composer {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 10px;
        padding: 10px;
        border: 1px solid #d9deea;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 12px 32px rgba(31, 42, 68, .08);
      }
      .composer textarea {
        min-height: 54px;
        resize: none;
        border: 0;
        outline: 0;
        padding: 6px;
      }
      .send { align-self: end; width: 40px; height: 40px; padding: 0; }
      .row { display: flex; gap: 8px; }
      .row > * { flex: 1; }
      @media (max-width: 760px) {
        .app { grid-template-columns: 1fr; }
        aside { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside>
        <div class="brand"><span class="brand-mark">P</span><span>PAI-RAG</span></div>

        <section class="panel">
          <h2>对话</h2>
          <button id="newChat" class="btn secondary" type="button">＋ 新建对话</button>
          <div id="threadList" class="status">当前为新对话</div>
        </section>

        <section class="panel">
          <h2>TaskManager</h2>
          <select id="taskType" class="field">
            <option value="proof.qa.chat">proof.qa.chat</option>
            <option value="ai.search.chat">ai.search.chat</option>
            <option value="pipeline.demo">pipeline.demo</option>
            <option value="table.audit">table.audit</option>
          </select>
          <textarea id="taskInput" class="field" placeholder="输入制度问题、搜索问题或 Pipeline 目标">这项制度的审批要求是什么？</textarea>
          <textarea id="taskRows" class="field" hidden>[
  {"id":"row-001","name":"Example A","amount":12000},
  {"id":"row-002","name":"Example B","amount":800}
]</textarea>
          <label id="humanReviewRow" class="status" hidden>
            <input id="taskHumanReview" type="checkbox" /> Pipeline 需要人工确认
          </label>
          <button id="runTask" class="btn" type="button">运行任务</button>
          <div id="taskStatus" class="status">Task: idle</div>
        </section>

        <section class="panel">
          <h2>知识库与能力</h2>
          <div class="row">
            <button id="ingestDefault" class="btn secondary" type="button">入库默认 PDF</button>
            <button id="refreshCapabilities" class="btn secondary" type="button">刷新能力</button>
          </div>
          <div id="ragStatus" class="status">RAG: 未加载</div>
          <div id="capabilityStatus" class="status">Capability: 未加载</div>
        </section>
      </aside>

      <section class="workspace">
        <header>
          <div class="model">
            <span>Agent</span>
            <select id="agentSelect" class="field"></select>
          </div>
          <div id="status" class="status">ready</div>
        </header>
        <main id="messages" class="messages">
          <div id="empty" class="empty">开始一轮 single-agent 对话，或从左侧运行 Proof 问答。</div>
        </main>
        <footer>
          <form id="form" class="composer">
            <textarea id="input" placeholder="给 TUGE single-agent 发消息" autofocus></textarea>
            <button id="send" class="btn send" type="submit" title="发送">↑</button>
          </form>
        </footer>
      </section>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const state = { threadId: null, userId: "simple-chat-user" };
      const headers = () => ({
        "Content-Type": "application/json",
        "X-User-Id": state.userId,
        "X-Tenant-Id": "default_tenant",
      });

      function appendMessage(role, text) {
        $("empty").hidden = true;
        const item = document.createElement("div");
        item.className = `message ${role}`;
        const label = document.createElement("div");
        label.className = "role";
        label.textContent = role === "user" ? "你" : "TUGE";
        const body = document.createElement("div");
        body.className = "body";
        body.textContent = text;
        item.append(label, body);
        $("messages").appendChild(item);
        $("messages").scrollTop = $("messages").scrollHeight;
        return body;
      }

      async function requestJson(url, options = {}) {
        const response = await fetch(url, options);
        const body = await response.json().catch(() => ({}));
        if (!response.ok) {
          const detail = body.detail?.message || body.detail || body.message || response.statusText;
          throw new Error(typeof detail === "string" ? detail : JSON.stringify(detail));
        }
        return body;
      }

      async function loadAgents() {
        try {
          const body = await requestJson("/scheduling/agents");
          const rows = body.agents || body.items || body || [];
          $("agentSelect").replaceChildren();
          for (const agent of rows) {
            const option = document.createElement("option");
            option.value = agent.agent_id || agent.id;
            option.textContent = agent.name || agent.agent_id || agent.id;
            $("agentSelect").appendChild(option);
          }
        } catch (_) {
          $("agentSelect").innerHTML = '<option value="default-single-agent">default-single-agent</option>';
        }
      }

      async function sendChat(text) {
        appendMessage("user", text);
        const target = appendMessage("assistant", "…");
        $("status").textContent = "running";
        try {
          const body = await requestJson("/single-agent/chat", {
            method: "POST",
            headers: headers(),
            body: JSON.stringify({
              message: text,
              user_id: state.userId,
              thread_id: state.threadId,
              agent_id: $("agentSelect").value || "default-single-agent",
              stream: false,
            }),
          });
          state.threadId = body.thread_id || state.threadId;
          target.textContent = body.response?.choices?.[0]?.message?.content || JSON.stringify(body, null, 2);
          $("threadList").textContent = state.threadId ? `Thread: ${state.threadId}` : "当前为新对话";
          $("status").textContent = "ready";
        } catch (error) {
          target.textContent = `请求失败：${error.message}`;
          $("status").textContent = "error";
        }
      }

      function taskPayload(taskType) {
        const text = $("taskInput").value.trim();
        if (taskType === "proof.qa.chat") return { question: text, top_k: 8 };
        if (taskType === "ai.search.chat") return { message: text, search_goal: text, max_results: 5 };
        if (taskType === "pipeline.demo") {
          return { goal: text, require_human_review: $("taskHumanReview").checked };
        }
        return {
          rows: JSON.parse($("taskRows").value),
          audit_goal: text,
          max_concurrency: 2,
        };
      }

      async function runTask() {
        const taskType = $("taskType").value;
        $("taskStatus").textContent = "Task: creating";
        try {
          const created = await requestJson("/task-manager/tasks", {
            method: "POST",
            headers: headers(),
            body: JSON.stringify({
              task_type: taskType,
              title: $("taskInput").value.trim(),
              input_payload: taskPayload(taskType),
              stream: false,
            }),
          });
          const taskId = created.task.id;
          $("taskStatus").textContent = `Task: ${taskId} running`;
          const completed = await requestJson(`/task-manager/tasks/${taskId}/run`, {
            method: "POST",
            headers: headers(),
            body: JSON.stringify({ stream: false }),
          });
          $("taskStatus").textContent = `Task: ${completed.task.status}`;
          appendMessage("assistant", JSON.stringify(completed.task.result_payload_json || completed.task, null, 2));
        } catch (error) {
          $("taskStatus").textContent = `Task error: ${error.message}`;
        }
      }

      async function loadRagStatus() {
        try {
          const body = await requestJson("/rag/status");
          $("ragStatus").textContent = `RAG: ${body.knowledgebase_count || 0} knowledgebase(s), ${body.chunk_count || 0} chunks`;
        } catch (_) {
          $("ragStatus").textContent = "RAG: unavailable";
        }
      }

      async function loadCapabilities() {
        try {
          const body = await requestJson("/capabilities");
          const rows = body.capabilities || body.items || body || [];
          const names = Array.isArray(rows) ? rows.map((item) => item.name || item.capability_id || item.id) : Object.keys(rows);
          $("capabilityStatus").textContent = `Capability: ${names.filter(Boolean).join(", ") || "none"}`;
        } catch (_) {
          $("capabilityStatus").textContent = "Capability: unavailable";
        }
      }

      $("form").addEventListener("submit", (event) => {
        event.preventDefault();
        const text = $("input").value.trim();
        if (!text) return;
        $("input").value = "";
        void sendChat(text);
      });
      $("newChat").addEventListener("click", () => {
        state.threadId = null;
        $("messages").replaceChildren($("empty"));
        $("empty").hidden = false;
        $("threadList").textContent = "当前为新对话";
      });
      $("runTask").addEventListener("click", () => void runTask());
      $("taskType").addEventListener("change", () => {
        const isTable = $("taskType").value === "table.audit";
        const isPipeline = $("taskType").value === "pipeline.demo";
        $("taskRows").hidden = !isTable;
        $("humanReviewRow").hidden = !isPipeline;
      });
      $("ingestDefault").addEventListener("click", async () => {
        $("ragStatus").textContent = "RAG: ingesting";
        try {
          await requestJson("/rag/ingest-default", { method: "POST" });
          await loadRagStatus();
        } catch (error) {
          $("ragStatus").textContent = `RAG error: ${error.message}`;
        }
      });
      $("refreshCapabilities").addEventListener("click", () => void loadCapabilities());

      void loadAgents();
      void loadRagStatus();
      void loadCapabilities();
    </script>
  </body>
</html>
