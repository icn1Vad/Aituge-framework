<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PAI-RAG Chat Replica</title>
    <style>
      :root {
        --bg: #f7f8fb;
        --sidebar: #f2f4f8;
        --panel: #ffffff;
        --line: #dfe4ec;
        --line-strong: #cfd7e3;
        --text: #242933;
        --muted: #6b7280;
        --soft: #eef2f7;
        --purple: #6d4bd8;
        --purple-dark: #5b3fc7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .app {
        height: 100vh;
        display: grid;
        grid-template-columns: 280px 1fr;
      }

      aside {
        height: 100vh;
        min-width: 0;
        display: flex;
        flex-direction: column;
        border-right: 1px solid var(--line);
        background: var(--sidebar);
      }

      .brand {
        height: 58px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 18px;
        font-weight: 700;
      }

      .brand-mark {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        color: #fff;
        background: var(--purple);
        font-weight: 800;
      }

      .nav {
        display: grid;
        gap: 2px;
        padding: 6px 12px 0;
      }

      .nav-item,
      .thread {
        border: 0;
        height: 38px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 10px;
        border-radius: 8px;
        color: #3f4652;
        background: transparent;
        font-family: inherit;
        font-size: 14px;
        text-align: left;
        cursor: pointer;
      }

      .nav-item.active {
        color: #222733;
        background: #e9eef6;
      }

      .section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px 8px;
        color: #4b5563;
        font-size: 14px;
      }

      .sidebar-view {
        min-height: 0;
        display: none;
        flex: 1;
        overflow: hidden;
      }

      .sidebar-view.active {
        display: flex;
        flex-direction: column;
      }

      .sidebar-scroll {
        min-height: 0;
        display: flex;
        flex: 1;
        flex-direction: column;
        overflow: auto;
        padding-bottom: 12px;
      }

      .new-chat {
        margin: 0 12px 8px;
        height: 40px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        color: #20242c;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 12px;
        cursor: pointer;
        font-size: 14px;
      }

      .rag-panel {
        margin: 4px 12px 10px;
        display: grid;
        gap: 8px;
      }

      .discussion-panel {
        margin: 4px 12px 10px;
        display: grid;
        gap: 8px;
      }

      .task-panel {
        margin: 8px 12px 10px;
        display: grid;
        gap: 8px;
      }

      .task-drawer {
        margin: 0 0 4px;
      }

      .task-drawer summary {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 8px 12px 0;
        padding: 8px 10px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        color: #20242c;
        cursor: pointer;
        font-size: 13px;
        list-style: none;
      }

      .task-drawer summary::-webkit-details-marker {
        display: none;
      }

      .task-drawer summary::after {
        content: "v";
        color: var(--muted);
        font-size: 12px;
      }

      .task-drawer[open] summary::after {
        content: "^";
      }

      .task-grid {
        display: grid;
        grid-template-columns: 1fr 72px;
        gap: 8px;
      }

      .task-input,
      .task-select {
        width: 100%;
        min-width: 0;
        height: 36px;
        padding: 0 9px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        color: #20242c;
        font-size: 13px;
      }

      .task-textarea {
        min-height: 74px;
        width: 100%;
        padding: 9px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        font-size: 13px;
        resize: vertical;
      }

      .task-items-textarea {
        min-height: 86px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
      }

      .task-debug {
        min-height: 44px;
        max-height: 120px;
        overflow: auto;
        white-space: pre-wrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 11px;
      }

      .discussion-topic {
        min-height: 70px;
        width: 100%;
        padding: 9px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        font-size: 13px;
      }

      .discussion-controls {
        display: grid;
        grid-template-columns: 1fr 72px;
        gap: 8px;
      }

      .discussion-agents,
      .discussion-debug {
        display: grid;
        gap: 6px;
        padding: 8px;
        border-radius: 8px;
        background: #e9eef6;
        font-size: 12px;
      }

      .discussion-debug {
        max-height: 180px;
        overflow: auto;
      }

      .discussion-debug-item {
        display: grid;
        gap: 3px;
        padding: 7px;
        border-radius: 7px;
        background: #fff;
        color: #475467;
      }

      .discussion-agent-option {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .discussion-agent-option span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .rag-actions {
        display: grid;
        grid-template-columns: 1fr 40px;
        gap: 8px;
      }

      .rag-btn {
        height: 36px;
        border: 1px solid var(--line-strong);
        border-radius: 8px;
        background: #fff;
        color: #20242c;
        cursor: pointer;
        font-size: 13px;
      }

      .rag-btn:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      .rag-file {
        display: none;
      }

      .rag-status {
        min-height: 28px;
        padding: 7px 9px;
        border-radius: 8px;
        color: #4b5563;
        background: #e9eef6;
        font-size: 12px;
        line-height: 1.25;
      }

      .rag-list {
        display: grid;
        gap: 8px;
        max-height: calc(100vh - 250px);
        overflow: auto;
      }

      .rag-card {
        display: grid;
        gap: 7px;
        padding: 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fff;
        font-size: 12px;
      }

      .rag-card-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }

      .rag-title {
        min-width: 0;
        color: #20242c;
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .rag-meta {
        color: var(--muted);
        line-height: 1.45;
        overflow-wrap: anywhere;
      }

      .rag-chip-row {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
      }

      .rag-chip {
        max-width: 100%;
        padding: 3px 6px;
        border-radius: 999px;
        color: #475467;
        background: #eef2f7;
        overflow-wrap: anywhere;
      }

      .rag-file-row {
        display: grid;
        gap: 4px;
        padding-top: 7px;
        border-top: 1px solid #edf0f5;
      }

      .rag-chunks {
        display: grid;
        gap: 4px;
      }

      .rag-chunk {
        padding: 6px;
        border-radius: 6px;
        color: #475467;
        background: #f8fafc;
        line-height: 1.4;
      }

      .thread-list {
        min-height: 120px;
        flex: 1;
        padding: 0 12px 16px;
        overflow: auto;
      }

      .history-section {
        min-height: 0;
        display: flex;
        flex: 1;
        flex-direction: column;
      }

      .thread {
        height: auto;
        min-height: 44px;
        align-items: flex-start;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        background: #e9eef6;
        margin-bottom: 8px;
      }

      .thread .title {
        width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .thread .preview {
        width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--muted);
        font-size: 12px;
      }

      .workspace {
        min-width: 0;
        height: 100vh;
        display: grid;
        grid-template-rows: 58px 1fr auto;
        background: #fff;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 28px;
        border-bottom: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.96);
      }

      .model-pill {
        height: 38px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 0 13px;
        border: 1px solid #d8d1ff;
        border-radius: 10px;
        color: #3f365f;
        background: #f6f3ff;
        font-weight: 650;
      }

      .agent-select {
        min-width: 176px;
        max-width: 260px;
        border: 0;
        outline: 0;
        color: #3f365f;
        background: transparent;
        font: inherit;
      }

      .model-name {
        color: #655d75;
        font-size: 12px;
        font-weight: 600;
      }

      .model-dot {
        width: 16px;
        height: 16px;
        border-radius: 5px;
        display: grid;
        place-items: center;
        color: var(--purple);
        border: 1px solid #cabfff;
        font-size: 11px;
      }

      .top-status {
        color: var(--muted);
        font-size: 13px;
      }

      .messages {
        overflow: auto;
        padding: 38px 64px 28px;
      }

      .empty {
        height: 100%;
        display: grid;
        place-items: center;
        color: #98a2b3;
      }

      .turn {
        display: flex;
        margin: 0 0 28px;
      }

      .turn.user {
        justify-content: flex-end;
      }

      .turn.assistant {
        justify-content: flex-start;
      }

      .bubble {
        max-width: min(720px, 78%);
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.7;
        font-size: 15px;
      }

      .user .bubble {
        padding: 11px 18px;
        color: #fff;
        background: var(--purple);
        border-radius: 22px 22px 6px 22px;
      }

      .assistant-wrap {
        display: grid;
        gap: 8px;
      }

      .assistant-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        color: #a6afbd;
        font-size: 13px;
      }

      .icon-btn {
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 6px;
        color: #98a2b3;
        background: transparent;
      }

      .token-badge {
        padding: 5px 10px;
        border-radius: 10px;
        color: #3f4652;
        background: #eef1f6;
        font-size: 13px;
      }

      .tool-list {
        display: grid;
        gap: 8px;
        max-width: min(720px, 78vw);
      }

      .tool-trace {
        border-left: 2px solid var(--purple);
        border-top: 1px solid #e4e7ef;
        border-right: 1px solid #e4e7ef;
        border-bottom: 1px solid #e4e7ef;
        border-radius: 7px;
        background: #fafbff;
        overflow: hidden;
        font-size: 12px;
      }

      .tool-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        color: #475467;
        background: #f4f6fb;
      }

      .tool-state {
        padding: 2px 6px;
        border-radius: 999px;
        color: var(--purple-dark);
        background: #ece9ff;
        font-size: 11px;
      }

      .tool-state.complete {
        color: #067647;
        background: #dcfae6;
      }

      .tool-state.error {
        color: #b42318;
        background: #fee4e2;
      }

      .tool-body {
        display: grid;
        gap: 6px;
        padding: 8px 10px 10px;
      }

      .tool-label {
        color: var(--muted);
        font-size: 11px;
      }

      .tool-code {
        margin: 0;
        max-height: 220px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        padding: 8px;
        border-radius: 6px;
        color: #344054;
        background: #fff;
        border: 1px solid #e7ebf3;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      }

      .tool-artifacts {
        display: grid;
        gap: 8px;
      }

      .tool-artifact {
        display: grid;
        gap: 5px;
      }

      .tool-artifact img {
        display: block;
        max-width: 100%;
        max-height: 420px;
        border: 1px solid #e7ebf3;
        border-radius: 6px;
        background: #fff;
        object-fit: contain;
      }

      .tool-artifact iframe {
        width: min(720px, 78vw);
        height: 420px;
        border: 1px solid #e7ebf3;
        border-radius: 6px;
        background: #fff;
      }

      footer {
        padding: 16px 64px 22px;
        background: #fff;
      }

      .composer {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: end;
        max-width: 960px;
        margin: 0 auto;
        padding: 10px;
        border: 1px solid var(--line-strong);
        border-radius: 12px;
        background: #fff;
        box-shadow: 0 8px 24px rgba(16, 24, 40, 0.06);
      }

      textarea {
        min-height: 48px;
        max-height: 160px;
        resize: vertical;
        border: 0;
        outline: 0;
        padding: 10px 12px;
        font: inherit;
        line-height: 1.5;
      }

      .composer-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 4px 4px 0;
      }

      label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
      }

      .send {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 10px;
        color: #fff;
        background: var(--purple);
        cursor: pointer;
        font-size: 18px;
      }

      .send:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }

      @media (max-width: 760px) {
        .app {
          grid-template-columns: 1fr;
        }

        aside {
          display: none;
        }

        .messages,
        footer {
          padding-left: 18px;
          padding-right: 18px;
        }

        header {
          padding: 0 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside>
        <div class="brand">
          <div class="brand-mark">P</div>
          <div>PAI-RAG</div>
        </div>
        <nav class="nav">
          <button class="nav-item" type="button" data-sidebar-view="rag">▣ 知识库</button>
          <button class="nav-item" type="button">▤ 应用</button>
          <button class="nav-item" type="button">⚖ 评估</button>
          <button class="nav-item active" type="button" data-sidebar-view="chat">○ 对话</button>
        </nav>
        <div id="chatSidebar" class="sidebar-view active" data-sidebar-panel="chat">
          <div class="sidebar-scroll">
            <div class="section-title">
              <span>多 Agent 讨论</span>
              <span>beta</span>
            </div>
            <div class="discussion-panel">
              <textarea id="discussionTopic" class="discussion-topic" placeholder="输入讨论主题"></textarea>
              <div id="discussionAgents" class="discussion-agents"></div>
              <div class="discussion-controls">
                <button id="startDiscussion" class="rag-btn" type="button">开始讨论</button>
                <label><input id="discussionRounds" type="number" min="1" max="5" value="1" /> 轮</label>
              </div>
              <div id="discussionStatus" class="rag-status">Discussion: idle</div>
              <div id="discussionDebug" class="discussion-debug"></div>
            </div>
            <div class="section-title">
              <span>对话</span>
              <span>⌃</span>
            </div>
            <button id="newChat" class="new-chat" type="button">＋ 新建对话</button>
            <details class="task-drawer" open>
              <summary><span>TaskManager v1</span><span>task</span></summary>
              <div class="task-panel">
                <select id="taskType" class="task-select">
                  <option value="ai.search.chat" selected>ai.search.chat</option>
                  <option value="media.script.generate">media.script.generate</option>
                  <option value="media.script.select">media.script.select</option>
                  <option value="media.chat">media.chat</option>
                  <option value="table.audit">table.audit</option>
                </select>
                <input id="taskTopic" class="task-input" value="Agent architecture and TaskManager" />
                <div class="task-grid">
                  <select id="taskPlatform" class="task-select">
                    <option value="douyin">douyin</option>
                  </select>
                  <input id="taskDuration" class="task-input" type="number" min="15" max="300" value="60" />
                </div>
                <textarea id="taskBrief" class="task-textarea">Use the meeting notes to explain the Agent layers and TaskManager boundary.</textarea>
                <textarea id="taskCandidates" class="task-textarea task-items-textarea">[
  {"id":"candidate-a","title":"TaskManager structure","content":"Explain task lifecycle, events, and item tracking."},
  {"id":"candidate-b","title":"Agent boundary","content":"Explain why business orchestration stays outside Single Agent."}
]</textarea>
                <textarea id="taskRows" class="task-textarea task-items-textarea">[
  {"id":"row-001","name":"A company","amount":12000,"note":"Contract amount is above the manual review line."},
  {"id":"row-002","name":"B company","amount":800,"note":"Routine low-risk record."}
]</textarea>
                <button id="runMediaTask" class="rag-btn" type="button">Run TaskManager task</button>
                <div id="taskStatus" class="rag-status">Task: idle</div>
                <div id="taskDebug" class="rag-status task-debug">structure: idle</div>
              </div>
            </details>
            <div class="history-section">
              <div class="section-title">
                <span>历史记录</span>
                <span>scroll</span>
              </div>
              <div id="threadList" class="thread-list"></div>
            </div>
          </div>
        </div>
        <div id="ragSidebar" class="sidebar-view" data-sidebar-panel="rag">
          <div class="sidebar-scroll">
            <div class="section-title">
              <span>知识库</span>
              <span>RAG</span>
            </div>
            <div class="rag-panel">
              <div class="rag-actions">
                <button id="ingestDefault" class="rag-btn" type="button">入库默认PDF</button>
                <button id="pickPdf" class="rag-btn" type="button" title="选择PDF">＋</button>
              </div>
              <input id="pdfFile" class="rag-file" type="file" accept="application/pdf,.pdf" />
              <div id="ragStatus" class="rag-status">RAG: 未加载</div>
              <div id="ragList" class="rag-list"></div>
            </div>
          </div>
        </div>
      </aside>

      <section class="workspace">
        <header>
          <div class="model-pill">
            <span class="model-dot">⌘</span>
            <select id="agentSelect" class="agent-select" title="选择 agent"></select>
            <span id="modelName" class="model-name">deepseek-v4-pro</span>
          </div>
          <div id="status" class="top-status">ready</div>
        </header>

        <main id="messages" class="messages">
          <div id="empty" class="empty">开始一轮最小 single-agent 对话</div>
        </main>

        <footer>
          <form id="form" class="composer">
            <textarea id="input" placeholder="给 TUGE single-agent 发消息" autofocus></textarea>
            <div class="composer-actions">
              <label><input id="stream" type="checkbox" checked /> stream</label>
              <button id="send" class="send" type="submit" title="发送">↑</button>
            </div>
          </form>
        </footer>
      </section>
    </div>

    <script>
      const messagesEl = document.getElementById("messages");
      const emptyEl = document.getElementById("empty");
      const inputEl = document.getElementById("input");
      const formEl = document.getElementById("form");
      const statusEl = document.getElementById("status");
      const sendEl = document.getElementById("send");
      const streamEl = document.getElementById("stream");
      const agentSelectEl = document.getElementById("agentSelect");
      const modelNameEl = document.getElementById("modelName");
      const newChatEl = document.getElementById("newChat");
      const threadListEl = document.getElementById("threadList");
      const ingestDefaultEl = document.getElementById("ingestDefault");
      const pickPdfEl = document.getElementById("pickPdf");
      const pdfFileEl = document.getElementById("pdfFile");
      const ragStatusEl = document.getElementById("ragStatus");
      const ragListEl = document.getElementById("ragList");
      const discussionTopicEl = document.getElementById("discussionTopic");
      const discussionAgentsEl = document.getElementById("discussionAgents");
      const discussionRoundsEl = document.getElementById("discussionRounds");
      const startDiscussionEl = document.getElementById("startDiscussion");
      const discussionStatusEl = document.getElementById("discussionStatus");
      const discussionDebugEl = document.getElementById("discussionDebug");
      const taskTypeEl = document.getElementById("taskType");
      const taskTopicEl = document.getElementById("taskTopic");
      const taskPlatformEl = document.getElementById("taskPlatform");
      const taskDurationEl = document.getElementById("taskDuration");
      const taskBriefEl = document.getElementById("taskBrief");
      const taskCandidatesEl = document.getElementById("taskCandidates");
      const taskRowsEl = document.getElementById("taskRows");
      const runMediaTaskEl = document.getElementById("runMediaTask");
      const taskStatusEl = document.getElementById("taskStatus");
      const taskDebugEl = document.getElementById("taskDebug");
      const sidebarNavItems = [...document.querySelectorAll("[data-sidebar-view]")];
      const sidebarPanels = [...document.querySelectorAll("[data-sidebar-panel]")];
      const USER_ID_KEY = "tuge-simple-chat-user-id";
      const AGENT_ID_KEY = "tuge-simple-chat-agent-id";
      const DEFAULT_AGENT_ID = "default-single-agent";

      let threadId = null;
      let activeMode = "chat";
      let currentDiscussionRunId = null;
      let currentThreadTitle = "初始问候";
      let threads = [];
      let agents = [];

      function createBrowserUserId() {
        if (globalThis.crypto?.randomUUID) {
          return `web-${globalThis.crypto.randomUUID()}`;
        }
        try {
          const values = new Uint32Array(4);
          globalThis.crypto?.getRandomValues?.(values);
          if (values.some(Boolean)) {
            return `web-${[...values].map((value) => value.toString(16)).join("-")}`;
          }
        } catch {
          // HTTP/IP test pages may not expose Web Crypto APIs.
        }
        return `web-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
      }

      function parseMaybeJson(value) {
        if (value === null || value === undefined) return value;
        if (typeof value !== "string") return value;
        const trimmed = value.trim();
        if (!trimmed) return "";
        if (!trimmed.startsWith("{") && !trimmed.startsWith("[")) return value;
        try {
          return JSON.parse(trimmed);
        } catch {
          return value;
        }
      }

      function formatToolValue(value) {
        const parsed = parseMaybeJson(value);
        if (parsed === null || parsed === undefined) return "";
        if (typeof parsed === "string") return parsed;
        return JSON.stringify(parsed, null, 2);
      }

      function toolFunction(toolCall) {
        return toolCall?.function || toolCall?.tool?.function || {};
      }

      function toolId(toolCall, fallback = "") {
        return toolCall?.id || toolCall?.tool?.id || fallback || crypto.randomUUID();
      }

      function splitToolResult(value) {
        const raw = String(value || "");
        const match = raw.match(/__TUGE_ARTIFACTS__(.*?)__END_TUGE_ARTIFACTS__/s);
        if (!match) return { text: raw, artifacts: [] };

        let artifacts = [];
        try {
          artifacts = JSON.parse(match[1])?.artifacts || [];
        } catch {
          artifacts = [];
        }
        return {
          text: raw.replace(match[0], "").trim(),
          artifacts,
        };
      }

      function renderArtifacts(trace, artifacts = []) {
        const container = trace.querySelector(".tool-artifacts");
        container.innerHTML = "";
        for (const artifact of artifacts) {
          if (!artifact?.url) continue;

          const item = document.createElement("div");
          item.className = "tool-artifact";
          const label = document.createElement("div");
          label.className = "tool-label";
          label.textContent = artifact.name || artifact.url;

          if (artifact.type === "image") {
            const img = document.createElement("img");
            img.src = artifact.url;
            img.alt = artifact.name || "artifact image";
            item.append(label, img);
          } else if (artifact.type === "html") {
            const iframe = document.createElement("iframe");
            iframe.src = artifact.url;
            iframe.sandbox = "allow-scripts";
            iframe.title = artifact.name || "artifact html";
            item.append(label, iframe);
          } else {
            const link = document.createElement("a");
            link.href = artifact.url;
            link.textContent = artifact.name || artifact.url;
            link.target = "_blank";
            link.rel = "noreferrer";
            item.append(label, link);
          }

          container.appendChild(item);
        }
        container.hidden = artifacts.length === 0;
      }

      function upsertToolTrace(nodes, toolCall, options = {}) {
        const id = toolId(toolCall, options.id);
        const fn = toolFunction(toolCall);
        const name = fn.name || options.name || "tool";
        let trace = nodes.toolMap.get(id);
        if (!trace) {
          trace = document.createElement("div");
          trace.className = "tool-trace";
          trace.innerHTML = `
            <div class="tool-head">
              <span class="tool-state">running</span>
              <strong class="tool-name"></strong>
            </div>
            <div class="tool-body">
              <div>
                <div class="tool-label">参数</div>
                <pre class="tool-code tool-args"></pre>
              </div>
              <div class="tool-result-wrap" hidden>
                <div class="tool-label">结果</div>
                <pre class="tool-code tool-result"></pre>
              </div>
              <div class="tool-artifacts" hidden></div>
            </div>
          `;
          nodes.tools.appendChild(trace);
          nodes.toolMap.set(id, trace);
        }

        trace.querySelector(".tool-name").textContent = name;
        const argsText = formatToolValue(fn.arguments || options.arguments || "");
        if (argsText) trace.querySelector(".tool-args").textContent = argsText;

        if (options.result !== undefined || options.error !== undefined) {
          const state = trace.querySelector(".tool-state");
          state.textContent = options.error ? "error" : "complete";
          state.classList.remove("complete", "error");
          state.classList.add(options.error ? "error" : "complete");
          const result = splitToolResult(options.error || options.result || "");
          trace.querySelector(".tool-result-wrap").hidden = false;
          trace.querySelector(".tool-result").textContent = result.text;
          renderArtifacts(trace, result.artifacts);
        }
        trace.scrollIntoView({ behavior: "smooth", block: "end" });
      }

      function renderSteps(nodes, steps = []) {
        for (const [index, step] of steps.entries()) {
          upsertToolTrace(nodes, step.tool, {
            id: step.tool?.id || `step-${index}`,
            result: step.result,
            error: step.error,
          });
        }
      }

      function renderSkills(nodes, skills) {
        const pkg = skills?.active_package;
        if (!pkg) return;
        const primary = pkg.primary?.name || null;
        const auxiliary = pkg.auxiliary_index || [];
        const path = [pkg.package_name, primary].filter(Boolean).join("-");
        const result = auxiliary.length
          ? auxiliary.map((skill) => `${skill.name}: ${skill.description || ""}`).join("\n")
          : "no auxiliary skills";
        upsertToolTrace(nodes, {
          id: `skill-package-${path || "active"}`,
          function: {
            name: `skill package: ${pkg.package_name}`,
            arguments: JSON.stringify({
              type: "skill_package",
              package_name: pkg.package_name,
              primary,
              auxiliary_index: auxiliary.map((skill) => skill.name),
            }, null, 2),
          },
        }, {
          id: `skill-package-${path || "active"}`,
          result,
        });
      }

      function renderDiscussionPayload(payload) {
        activeMode = "discussion";
        currentDiscussionRunId = payload.run?.id || currentDiscussionRunId;
        threadId = payload.run?.public_thread_id || threadId;
        currentThreadTitle = payload.run?.topic?.slice(0, 18) || "多 Agent 讨论";
        messagesEl.innerHTML = "";

        for (const message of payload.messages || []) {
          const speaker = message.discussion?.speaker_name || message.discussion?.speaker_id;
          if (message.role === "user") {
            addUserMessage(speaker && speaker !== "User" ? `${speaker}: ${message.text || ""}` : message.text || "");
          }
          if (message.role === "assistant") {
            const label = speaker ? `${speaker}: ` : "";
            const nodes = addAssistantText(`${label}${message.text || ""}`);
            renderSkills(nodes, message.turn?.skills);
            renderSteps(nodes, message.turn?.steps || []);
          }
        }
        if (!messagesEl.children.length) {
          messagesEl.innerHTML = '<div id="empty" class="empty">还没有公开发言</div>';
        }
        renderDiscussionDebug(payload.turns || []);
        renderThreads((payload.run?.final_output?.content || payload.run?.topic || "").slice(0, 36));
        discussionStatusEl.textContent = `Discussion: ${payload.run?.status || "loaded"} · ${payload.turns?.length || 0} turns`;
      }

      function consumeDiscussionSingleEvent(nodes, event, payload) {
        const single = payload.single_event || {};
        const data = single.data || {};
        if (event === "metadata") {
          renderSkills(nodes, data.skills);
          statusEl.textContent = `discussion: ${payload.agent_id}`;
        }
        if (event === "chunk") {
          if (data.actions) {
            for (const action of data.actions) upsertToolTrace(nodes, action);
          }
          if (data.observation) {
            const observation = data.observation;
            upsertToolTrace(nodes, observation.tool, {
              id: observation.tool?.id,
              result: observation.result,
              error: observation.error,
            });
          }
          const usage = data.usage;
          if (usage) nodes.token.textContent = `${usage.total_tokens || 0} tokens`;
        }
        if (event === "final") {
          const usage = data.usage;
          if (usage) nodes.token.textContent = `${usage.total_tokens || 0} tokens`;
        }
      }

      async function addDiscussionUserMessage(text) {
        if (!currentDiscussionRunId) throw new Error("没有可插话的 discussion run");
        const res = await fetch(`/scheduling/discussions/runs/${encodeURIComponent(currentDiscussionRunId)}/messages`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content: text, user_id: userId }),
        });
        if (!res.ok) throw new Error(await responseErrorText(res));
        addUserMessage(text);
        discussionStatusEl.textContent = "Discussion: 已插话，后续 agent 会看到";
      }

      async function startDiscussion() {
        const topic = discussionTopicEl.value.trim();
        const participantAgentIds = selectedDiscussionParticipants();
        if (!topic || !participantAgentIds.length) return;

        activeMode = "discussion";
        currentDiscussionRunId = null;
        currentThreadTitle = topic.slice(0, 18);
        messagesEl.innerHTML = "";
        discussionDebugEl.innerHTML = "";
        addUserMessage(topic);
        setDiscussionBusy(true, "Discussion: starting");

        const request = {
          topic,
          participant_agent_ids: participantAgentIds,
          moderator_agent_id: participantAgentIds[participantAgentIds.length - 1],
          user_id: userId,
          max_rounds: Math.max(1, Math.min(5, Number(discussionRoundsEl.value || 1))),
          stream: streamEl.checked,
        };

        if (!request.stream) {
          const res = await fetch("/scheduling/discussions/runs", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(request),
          });
          if (!res.ok) throw new Error(await responseErrorText(res));
          renderDiscussionPayload(await res.json());
          setDiscussionBusy(false, "Discussion: completed");
          await loadThreads();
          return;
        }

        const res = await fetch("/scheduling/discussions/runs", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(request),
        });
        if (!res.ok || !res.body) throw new Error(await responseErrorText(res));

        const turnNodes = new Map();
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          buffer = parseSse(buffer, (event, payload) => {
            if (event === "discussion_started") {
              currentDiscussionRunId = payload.run_id;
              setDiscussionBusy(true, "Discussion: running");
            }
            if (event === "turn_started") {
              const nodes = addAssistantText(`${payload.agent_id}: 思考中...`);
              turnNodes.set(payload.turn_id, nodes);
            }
            if (["metadata", "chunk", "final"].includes(event)) {
              const nodes = turnNodes.get(payload.turn_id);
              if (nodes) consumeDiscussionSingleEvent(nodes, event, payload);
            }
            if (event === "turn_finished") {
              const nodes = turnNodes.get(payload.turn_id) || addAssistantMessage();
              const prefix = `${payload.agent_id} ${payload.action}`;
              nodes.bubble.textContent = payload.action === "speak"
                ? `${payload.agent_id}: ${payload.content || ""}`
                : `${prefix}: ${payload.reason || ""}`;
              discussionStatusEl.textContent = `Discussion: ${prefix}`;
            }
            if (event === "discussion_finished") {
              renderDiscussionPayload(payload);
              setDiscussionBusy(false, "Discussion: completed");
            }
          });
        }
        await loadThreads();
      }

        const params = document.createElement("div");
        params.className = "rag-card";
        const paramsHead = document.createElement("div");
        paramsHead.className = "rag-card-head";
        const paramsTitle = document.createElement("div");
        paramsTitle.className = "rag-title";
        paramsTitle.textContent = "检索参数";
        paramsHead.appendChild(paramsTitle);
        const paramsBackend = document.createElement("div");
        paramsBackend.className = "rag-meta";
        paramsBackend.textContent = `mode: ${retrieval.mode || "-"} · backend: ${retrieval.backend || "-"}`;
        const paramsModels = document.createElement("div");
        paramsModels.className = "rag-meta";
        paramsModels.textContent = `embedding: ${retrieval.embedding || "未启用"} · rerank: ${retrieval.rerank || "未启用"}`;
        const paramsChips = document.createElement("div");
        paramsChips.className = "rag-chip-row";
        params.append(paramsHead, paramsBackend, paramsModels, paramsChips);
        for (const tool of retrieval.tools_per_kb || []) {
          const chip = document.createElement("span");
          chip.className = "rag-chip";
          chip.textContent = tool;
          paramsChips.appendChild(chip);
        }
        ragListEl.appendChild(params);

        const knowledgebases = data.knowledgebases || [];

          const empty = document.createElement("div");
          empty.className = "rag-card rag-meta";
          empty.textContent = "还没有 PDF 入库";
          ragListEl.appendChild(empty);
          return;
        }

        for (const kb of knowledgebases) {
          const card = document.createElement("div");
          card.className = "rag-card";
          const head = document.createElement("div");
          head.className = "rag-card-head";
          const kbTitle = document.createElement("div");
          kbTitle.className = "rag-title";
          kbTitle.textContent = kb.name || "未命名 KB";
          const kbId = document.createElement("div");
          kbId.className = "rag-meta";
          kbId.textContent = `KB ${kb.id}`;
          head.append(kbTitle, kbId);
          card.appendChild(head);

          const summary = document.createElement("div");
          summary.className = "rag-meta";
          summary.textContent = `${kb.file_count || 0} 文件 · ${kb.chunk_count || 0} chunks`;
          card.appendChild(summary);

            desc.className = "rag-meta";
            desc.textContent = kb.description;
            card.appendChild(desc);

            const chip = document.createElement("span");
            chip.className = "rag-chip";
            chip.textContent = toolName;
            toolRow.appendChild(chip);
          }

          for (const file of kb.files || []) {

          task_type: taskType,
          task_key: `simple-chat-${taskType}-${Date.now()}`,
          title: taskTopicEl.value.trim() || "Media script task",
          user_id: userId,
          stream: true,
          input_payload: inputPayload,
          output_schema: {
            mode: "json_object",
            task_type: taskType,
          },
          metadata: {
            source: "simple-chat-task-panel",
          },
        };
      }

      function parseJsonArray(element, label) {
        const text = element.value.trim();
        if (!text) return [];
        const parsed = JSON.parse(text);
        if (!Array.isArray(parsed)) throw new Error(`${label} must be a JSON array.`);
        return parsed;
      }

      function taskRequestHeaders(extra = {}) {
        return {
          "X-User-Id": userId,
          "X-Tenant-Id": "__default_tenant_id__",
          ...extra,
        };
      }

      async function loadTaskStructure(taskId) {
        const [taskRes, itemsRes, eventsRes] = await Promise.all([
          fetch(`/task-manager/tasks/${encodeURIComponent(taskId)}`, { headers: taskRequestHeaders() }),
          fetch(`/task-manager/tasks/${encodeURIComponent(taskId)}/items`, { headers: taskRequestHeaders() }),
          fetch(`/task-manager/tasks/${encodeURIComponent(taskId)}/events?limit=20`, { headers: taskRequestHeaders() }),
        ]);
        const taskBody = taskRes.ok ? await taskRes.json() : {};
        const itemsBody = itemsRes.ok ? await itemsRes.json() : {};
        const eventsBody = eventsRes.ok ? await eventsRes.json() : {};
        const task = taskBody.task || {};
        const items = itemsBody.items || [];
        const events = eventsBody.events || [];
        const summary = {
          task_id: task.id,
          status: task.status,
          handler: task.handler_name,
          progress: `${task.progress_current || 0}/${task.progress_total || 0}`,
          root_task_id: task.root_task_id,
          task_key: task.task_key,
          items: items.map((item) => ({
            key: item.item_key,
            type: item.item_type,
            status: item.status,
          })),
          recent_events: events.slice(-6).map((event) => ({
            seq: event.sequence,
            type: event.event_type,
            step: event.step_id,
            stage: event.stage,
          })),
        };
        taskDebugEl.textContent = JSON.stringify(summary, null, 2);
        return { task, items, events };
      }

      async function runMediaTask() {
        const payload = buildMediaTaskPayload();
        if (!(payload.input_payload.topic || payload.input_payload.message)) return;
        activeMode = "task";
        currentThreadTitle = payload.title.slice(0, 18);
        addUserMessage(`TaskManager: ${payload.title}`);
        const nodes = addAssistantMessage();
        nodes.bubble.textContent = "";
        setTaskBusy(true, "Task: streaming");
        setBusy(true, "task");

        const res = await fetch("/task-manager/stream", {
          method: "POST",
          headers: taskRequestHeaders({ "Content-Type": "application/json" }),
          body: JSON.stringify(payload),
        });
        if (!res.ok || !res.body) throw new Error(await responseErrorText(res));

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        let taskId = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          buffer = parseSse(buffer, async (event, payload) => {
            taskId = payload.task_id || taskId;
            taskStatusEl.textContent = `Task: ${event}${taskId ? ` / ${taskId.slice(0, 8)}` : ""}`;
            const delta = payload.payload_json?.delta || "";
            if (delta) {
              nodes.bubble.textContent += delta;
              nodes.bubble.scrollIntoView({ behavior: "smooth", block: "end" });
            }
            if (event === "task_failed") {
              nodes.bubble.textContent += `\n\nTask failed: ${payload.message || payload.payload_json?.message || ""}`;
            }
            if (event === "task_succeeded" && taskId) {
              const { task, items } = await loadTaskStructure(taskId);
              threadId = task.thread_id || threadId;
              const result = task.result_payload_json || {};
              nodes.bubble.textContent = JSON.stringify(
                {
                  result: result.structured || result,
                  task_manager: {
                    task_id: task.id,
                    handler: task.handler_name,
                    progress: `${task.progress_current || 0}/${task.progress_total || 0}`,
                    item_count: items.length,
                  },
                },
                null,
                2
              );
              renderThreads((result.content || "").slice(0, 36));
            }
          });
        }
        if (taskId) await loadTaskStructure(taskId);
        await loadThreads();
        setTaskBusy(false, taskId ? `Task: done / ${taskId.slice(0, 8)}` : "Task: done");
        setBusy(false, "ready");
      }

      function parseSse(buffer, onEvent) {
        const parts = buffer.split("\n\n");
        const rest = parts.pop() || "";
        for (const part of parts) {
          const lines = part.split("\n");
          const event = (lines.find((line) => line.startsWith("event: ")) || "event: message").slice(7);
          const dataLine = lines.find((line) => line.startsWith("data: "));
          if (!dataLine) continue;
          onEvent(event, JSON.parse(dataLine.slice(6)));
        }
        return rest;
      }

      function buildChatPayload(text, stream) {
        return {
          message: text,
          user_id: userId,
          thread_id: threadId,
          session_id: threadId,
          stream,
        };
      }

      function visibleHistoryThreads(items) {
        const titles = new Set(items.map((thread) => thread.title || ""));
        return items.filter((thread) => {
          const title = thread.title || "";
          const baseTitle = title.replace(/ \/ [a-z0-9][a-z0-9-]*-agent$/i, "");
          return baseTitle === title || !titles.has(baseTitle);
        });
      }

      async function loadThreads() {
        const res = await fetch(`/single-agent/threads?user_id=${encodeURIComponent(userId)}`);
        if (!res.ok) return;
        const data = await res.json();
        threads = visibleHistoryThreads((data.threads || []).map((thread) => ({
          id: thread.id,
          title: thread.title || "新会话",
          preview: thread.updated_at || "",
        })));
        renderThreads("");
      }

      async function loadThread(id) {
        const res = await fetch(`/single-agent/threads/${encodeURIComponent(id)}/messages`);
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        threadId = data.thread.id;
        currentThreadTitle = data.thread.title || "新会话";
        messagesEl.innerHTML = "";
        for (const message of data.messages || []) {
          if (message.role === "user") addUserMessage(message.text || "");
          if (message.role === "assistant") addAssistantText(message.text || "");
        }
        if (!messagesEl.children.length) {
          messagesEl.innerHTML = '<div id="empty" class="empty">开始一轮最小 single-agent 对话</div>';
        }
        renderThreads("");
      }

      async function sendNonStream(text) {
        const res = await fetch(schedulingChatUrl(), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(buildChatPayload(text, false)),
        });
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();
        threadId = data.thread_id;
        return data;
      }

      async function sendStream(text, nodes) {
        const res = await fetch(schedulingChatUrl(), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(buildChatPayload(text, true)),
        });
        if (!res.ok || !res.body) throw new Error(await res.text());

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          buffer = parseSse(buffer, (event, payload) => {
            if (event === "metadata") {
              threadId = payload.thread_id;
              renderSkills(nodes, payload.data?.skills);
              statusEl.textContent = "streaming";
            }
            if (event === "chunk") {
              if (payload.data?.actions) {
                for (const action of payload.data.actions) upsertToolTrace(nodes, action);
              }
              if (payload.data?.observation) {
                const observation = payload.data.observation;
                upsertToolTrace(nodes, observation.tool, {
                  id: observation.tool?.id,
                  result: observation.result,
                  error: observation.error,
                });
              }
              const delta = payload.data?.choices?.[0]?.delta?.content || "";
              const usage = payload.data?.usage;
              if (delta) {
                nodes.bubble.textContent += delta;
                renderThreads(nodes.bubble.textContent.slice(0, 36));
                nodes.bubble.scrollIntoView({ behavior: "smooth", block: "end" });
              }
              if (usage) nodes.token.textContent = `${usage.total_tokens || 0} tokens`;
            }
            if (event === "final") {
              const usage = payload.data?.usage;
              if (usage) nodes.token.textContent = `${usage.total_tokens || 0} tokens`;
            }
          });
        }
      }

      newChatEl.addEventListener("click", () => {
        threadId = null;
        activeMode = "chat";
        currentDiscussionRunId = null;
        currentThreadTitle = "新会话";
        messagesEl.innerHTML = '<div id="empty" class="empty">开始一轮最小 single-agent 对话</div>';
        renderThreads("");
        inputEl.focus();
      });

      ingestDefaultEl.addEventListener("click", ingestDefaultPdf);
      pickPdfEl.addEventListener("click", () => pdfFileEl.click());
      pdfFileEl.addEventListener("change", () => ingestUploadedPdf(pdfFileEl.files?.[0]));
      startDiscussionEl.addEventListener("click", async () => {
        try {
          await startDiscussion();
          setBusy(false, "ready");
        } catch (error) {
          setDiscussionBusy(false, `Discussion: ${error.message}`);
          setBusy(false, "error");
        }
      });
      runMediaTaskEl.addEventListener("click", async () => {
        try {
          await runMediaTask();
        } catch (error) {
          setTaskBusy(false, `Task: ${error.message}`);
          setBusy(false, "error");
        }
      });
      for (const item of sidebarNavItems) {
        item.addEventListener("click", () => switchSidebarView(item.dataset.sidebarView));
      }
      agentSelectEl.addEventListener("change", () => {
        localStorage.setItem(AGENT_ID_KEY, selectedAgentId());
        updateSelectedAgentMeta();
      });

      formEl.addEventListener("submit", async (event) => {
        event.preventDefault();
        const text = inputEl.value.trim();
        if (!text) return;

        inputEl.value = "";
        if (activeMode === "discussion" && currentDiscussionRunId) {
          try {
            await addDiscussionUserMessage(text);
          } catch (error) {
            statusEl.textContent = `插话失败：${error.message}`;
          }
          return;
        }

        currentThreadTitle = text.slice(0, 18);
        addUserMessage(text);
        const assistant = addAssistantMessage();
        renderThreads(text);
        setBusy(true, "thinking");

        try {
          if (streamEl.checked) {
            await sendStream(text, assistant);
          } else {
            const data = await sendNonStream(text);
            const response = data.response;
            renderSkills(assistant, data.skills);
            assistant.bubble.textContent = response?.choices?.[0]?.message?.content || "";
            renderSteps(assistant, response?.steps || []);
            const usage = response?.usage;
            if (usage) assistant.token.textContent = `${usage.total_tokens || 0} tokens`;
            renderThreads(assistant.bubble.textContent.slice(0, 36));
          }
          await loadThreads();
          setBusy(false, "ready");
        } catch (error) {
          assistant.bubble.textContent = `请求失败：${error.message}`;
          setBusy(false, "error");
        }
      });

      renderThreads("");
      loadAgents().catch((error) => {
        statusEl.textContent = "agent load failed";
        agentSelectEl.innerHTML = `<option value="${DEFAULT_AGENT_ID}">Default Single Agent</option>`;
        modelNameEl.textContent = "deepseek-v4-pro";
        console.warn(error);
      });
      loadThreads();
      refreshRagStatus().catch(() => {
        ragStatusEl.textContent = "RAG: 状态不可用";
        ragListEl.innerHTML = "";
      });
    </script>
  </body>
</html>
