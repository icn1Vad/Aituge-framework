<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Memory Test</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #172033;
      background: #f4f6fa;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    button, input, textarea { font: inherit; letter-spacing: 0; }
    .shell { min-height: 100vh; display: grid; grid-template-rows: 64px 1fr; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; background: #fff; border-bottom: 1px solid #dfe4ed;
    }
    h1 { margin: 0; font-size: 18px; font-weight: 700; }
    .status { font-size: 13px; color: #5f6b7d; }
    .status.busy { color: #2856d8; }
    .status.error { color: #b42318; }
    main {
      width: min(1180px, 100%); margin: 0 auto; padding: 24px;
      display: grid; grid-template-columns: minmax(320px, 420px) minmax(0, 1fr); gap: 20px;
    }
    section { background: #fff; border: 1px solid #dfe4ed; border-radius: 8px; }
    .panel-head { padding: 18px 20px 14px; border-bottom: 1px solid #edf0f5; }
    .panel-head h2 { margin: 0; font-size: 16px; }
    .panel-body { padding: 20px; }
    .field { display: grid; gap: 7px; margin-bottom: 16px; }
    label { font-size: 12px; font-weight: 650; color: #4c576a; }
    input, textarea {
      width: 100%; border: 1px solid #cfd6e2; border-radius: 6px;
      padding: 10px 12px; color: #172033; background: #fff; outline: none;
    }
    input:focus, textarea:focus { border-color: #3769e8; box-shadow: 0 0 0 3px #e8efff; }
    textarea { min-height: 116px; resize: vertical; line-height: 1.6; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }
    button {
      min-height: 38px; border: 1px solid #cfd6e2; border-radius: 6px;
      padding: 0 14px; background: #fff; color: #263247; cursor: pointer;
    }
    button.primary { background: #2856d8; border-color: #2856d8; color: #fff; }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .memory-meta { display: flex; gap: 16px; margin-bottom: 12px; color: #657086; font-size: 12px; }
    .memory {
      min-height: 180px; margin: 0; padding: 16px; border: 1px solid #e1e6ef;
      border-radius: 6px; background: #f8fafc; white-space: pre-wrap; line-height: 1.7;
      overflow-wrap: anywhere;
    }
    .verify { margin-top: 20px; padding-top: 20px; border-top: 1px solid #edf0f5; }
    .verify h3 { margin: 0 0 12px; font-size: 14px; }
    .answer {
      min-height: 140px; margin-top: 12px; padding: 16px; border-left: 3px solid #2856d8;
      background: #f7f9fd; white-space: pre-wrap; line-height: 1.65; overflow-wrap: anywhere;
    }
    .log {
      margin-top: 20px; max-height: 180px; overflow: auto; padding: 12px;
      background: #101827; color: #d7deea; border-radius: 6px; font: 12px/1.55 Consolas, monospace;
      white-space: pre-wrap;
    }
    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; padding: 14px; }
      header { padding: 0 16px; }
      .row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>Task Memory Test</h1>
      <div id="status" class="status">就绪</div>
    </header>
    <main>
      <section>
        <div class="panel-head"><h2>Task 范围</h2></div>
        <div class="panel-body">
          <div class="row">
            <div class="field">
              <label for="userId">用户 ID</label>
              <input id="userId" value="lzt">
            </div>
            <div class="field">
              <label for="tenantId">租户 ID</label>
              <input id="tenantId" value="__default_tenant_id__">
            </div>
          </div>
          <div class="field">
            <label for="taskKey">稳定业务 Task ID</label>
            <input id="taskKey" value="media_script">
          </div>
          <div class="field">
            <label for="newInformation">确认加入记忆的内容</label>
            <textarea id="newInformation">以后脚本开头优先直接给出核心结论，使用自然口语。</textarea>
          </div>
          <div class="actions">
            <button id="loadButton" type="button">读取最新</button>
            <button id="saveButton" class="primary" type="button">压缩并保存</button>
          </div>
          <div id="log" class="log">等待操作。</div>
        </div>
      </section>

      <section>
        <div class="panel-head"><h2>最新 Task Memory</h2></div>
        <div class="panel-body">
          <div class="memory-meta">
            <span id="version">版本：-</span>
            <span id="updatedAt">更新时间：-</span>
          </div>
          <pre id="memory" class="memory">当前没有已加载的 Memory。</pre>
          <div class="verify">
            <h3>主 Scene 验证</h3>
            <div class="field">
              <label for="verifyQuestion">验证问题</label>
              <input id="verifyQuestion" value="请只复述你在当前 Task Memory 中看到的长期要求，不要补充新的要求。">
            </div>
            <button id="verifyButton" type="button">调用 media.chat 验证</button>
            <div id="answer" class="answer">尚未验证。</div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const controls = ["loadButton", "saveButton", "verifyButton"].map($);

    function headers() {
      return {
        "Content-Type": "application/json",
        "X-User-Id": $("userId").value.trim(),
        "X-Tenant-Id": $("tenantId").value.trim(),
      };
    }

    function taskKey() {
      const value = $("taskKey").value.trim();
      if (!value) throw new Error("稳定业务 Task ID 不能为空。");
      return value;
    }

    function setBusy(busy, message = "处理中") {
      controls.forEach((item) => item.disabled = busy);
      if (busy) {
        $("status").className = "status busy";
        $("status").textContent = message;
      } else if ($("status").classList.contains("busy")) {
        $("status").className = "status";
        $("status").textContent = "就绪";
      }
    }

    function log(label, value) {
      const time = new Date().toLocaleTimeString();
      const body = typeof value === "string" ? value : JSON.stringify(value, null, 2);
      $("log").textContent = `[${time}] ${label}\n${body}`;
    }

    function renderMemory(item) {
      if (!item) {
        $("version").textContent = "版本：-";
        $("updatedAt").textContent = "更新时间：-";
        $("memory").textContent = "当前 Task 还没有 Memory。";
        return;
      }
      $("version").textContent = `版本：v${item.version}`;
      const timestamp = item.created_at.endsWith("Z") ? item.created_at : `${item.created_at}Z`;
      $("updatedAt").textContent = `更新时间：${new Date(timestamp).toLocaleString()}`;
      $("memory").textContent = item.content;
    }

    async function request(path, options = {}) {
      const response = await fetch(path, {...options, headers: {...headers(), ...(options.headers || {})}});
      const body = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(body.detail || `HTTP ${response.status}`);
      return body;
    }

    async function loadMemory() {
      setBusy(true, "读取中");
      try {
        const body = await request(`/task-manager/memories/${encodeURIComponent(taskKey())}`);
        renderMemory(body.memory);
        log("读取完成", body);
      } catch (error) {
        $("status").className = "status error";
        $("status").textContent = "读取失败";
        log("读取失败", error.message);
      } finally {
        setBusy(false);
      }
    }

    async function saveMemory() {
      const information = $("newInformation").value.trim();
      if (!information) return log("校验失败", "确认加入记忆的内容不能为空。");
      setBusy(true, "压缩中");
      try {
        const body = await request(
          `/task-manager/memories/${encodeURIComponent(taskKey())}/compress`,
          {method: "POST", body: JSON.stringify({new_information: information})},
        );
        renderMemory(body.memory);
        log("已保存新版本", body);
      } catch (error) {
        $("status").className = "status error";
        $("status").textContent = "保存失败";
        log("保存失败", error.message);
      } finally {
        setBusy(false);
      }
    }

    async function verifyMemory() {
      setBusy(true, "验证中");
      $("answer").textContent = "模型正在读取主 Scene……";
      try {
        const body = await request("/task-manager/run", {
          method: "POST",
          body: JSON.stringify({
            task_type: "media.chat",
            task_key: taskKey(),
            title: "Task Memory Scene Verification",
            input_payload: {
              message: $("verifyQuestion").value.trim(),
              context: {test_mode: "task_memory_scene"},
            },
          }),
        });
        const result = body.task && body.task.result_payload_json;
        const content = (result && result.content) || "模型没有返回可展示文本。";
        $("answer").textContent = content.replaceAll("**", "");
        log("验证完成", {task_id: body.task && body.task.id, result});
      } catch (error) {
        $("answer").textContent = error.message;
        $("status").className = "status error";
        $("status").textContent = "验证失败";
        log("验证失败", error.message);
      } finally {
        setBusy(false);
      }
    }

    $("loadButton").addEventListener("click", loadMemory);
    $("saveButton").addEventListener("click", saveMemory);
    $("verifyButton").addEventListener("click", verifyMemory);
  </script>
</body>
</html>
