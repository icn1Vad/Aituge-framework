apiVersion: 1

deleteDatasources:
  - {name: Test Loki, orgId: 1}
  - {name: Test Tempo, orgId: 1}
  - {name: Test Prometheus, orgId: 1}

datasources:
  - name: Test Loki
    uid: test-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
  - name: Test Tempo
    uid: test-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: false
    editable: false
  - name: Test Prometheus
    uid: test-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
