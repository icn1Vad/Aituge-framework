name: contract-review-code-dev-observability

x-test-labels: &test-labels
  com.aituge.environment: test
  com.aituge.stack: contract-review-code-dev-observability
  com.aituge.observability.scope: contract-review-code-dev
  com.aituge.observability.capture: enabled

x-test-logging: &test-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"
    compress: "true"

x-test-security: &test-security
  security_opt:
    - no-new-privileges:true

services:
  loki:
    image: ${CONTRACT_REVIEW_DEV_LOKI_IMAGE:?must be approved grafana/loki:3.7.2@sha256 digest}
    pull_policy: never
    command:
      - -config.file=/etc/loki/config.yml
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    labels: *test-labels
    logging: *test-logging
    <<: *test-security
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - observability-backend

  alloy:
    image: ${CONTRACT_REVIEW_DEV_ALLOY_IMAGE:?must be approved grafana/alloy:v1.18.0@sha256 digest}
    pull_policy: never
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.25"
    labels: *test-labels
    logging: *test-logging
    <<: *test-security
    depends_on:
      - loki
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ${CONTRACT_REVIEW_DEV_OBSERVABILITY_LOG_ROOT:?required}:/var/log/contract-review-code-dev:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      - observability-backend

  tempo:
    image: ${CONTRACT_REVIEW_DEV_TEMPO_IMAGE:?must be approved grafana/tempo:2.10.5@sha256 digest}
    pull_policy: never
    command:
      - -config.file=/etc/tempo/config.yml
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1.0"
    labels: *test-labels
    logging: *test-logging
    <<: *test-security
    volumes:
      - ./tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    networks:
      - observability-backend

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0@sha256:666fb40ee1391aa9f0eddb06ea143ffe215d731ff02cf13ce4c2f44f2a3bf89a
    pull_policy: never
    command:
      - --config=/etc/otelcol-contrib/config.yml
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    labels: *test-labels
    logging: *test-logging
    <<: *test-security
    depends_on:
      - tempo
    volumes:
      - ./otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    networks:
      - observability-ingest
      - observability-backend

  prometheus:
    image: prom/prometheus:v3.13.0@sha256:b96d6068885d3045ae74e149890aa574948f6fcaa6005b82171c6b2be7947998
    pull_policy: never
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=10d
    restart: unless-stopped
    mem_limit: 768m
    cpus: "0.5"
    labels: *test-labels
    logging: *test-logging
    <<: *test-security
    depends_on:
      - otel-collector
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks:
      - observability-backend

  alertmanager:
    image: ${CONTRACT_REVIEW_DEV_ALERTMANAGER_IMAGE:?must be approved prom/alertmanager:v0.32.1@sha256 digest}
    pull_policy: never
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    restart: unless-stopped
    mem_limit: 128m
    cpus: "0.1"
    labels: *test-labels
    logging: *test-logging
    <<: *test-security
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - observability-backend

  grafana-secret-init:
    image: ${CONTRACT_REVIEW_DEV_GRAFANA_IMAGE:?must be approved grafana/grafana:13.1.0@sha256 digest}
    pull_policy: never
    user: "0:0"
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        source=/run/secrets/grafana_admin_password
        target=/run/grafana-secret/grafana_admin_password
        temporary="$${target}.tmp"
        rm -f "$$temporary"
        cp "$$source" "$$temporary"
        chown 472:0 "$$temporary"
        chmod 0400 "$$temporary"
        mv -f "$$temporary" "$$target"
        test "$$(stat -c '%u:%g:%a' "$$target")" = "472:0:400"
    restart: "no"
    mem_limit: 64m
    cpus: "0.1"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    labels: *test-labels
    logging: *test-logging
    <<: *test-security
    secrets:
      - grafana_admin_password
    volumes:
      - grafana-secret-runtime:/run/grafana-secret

  grafana:
    image: ${CONTRACT_REVIEW_DEV_GRAFANA_IMAGE:?must be approved grafana/grafana:13.1.0@sha256 digest}
    pull_policy: never
    user: "472:0"
    restart: unless-stopped
    mem_limit: 512m
    cpus: "0.5"
    labels: *test-labels
    logging: *test-logging
    <<: *test-security
    depends_on:
      grafana-secret-init:
        condition: service_completed_successfully
      loki:
        condition: service_started
      tempo:
        condition: service_started
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${CONTRACT_REVIEW_DEV_GRAFANA_ADMIN_USER:?required}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/grafana-secret/grafana_admin_password
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SERVER_DOMAIN: 127.0.0.1
    volumes:
      - grafana-secret-runtime:/run/grafana-secret:ro
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${CONTRACT_REVIEW_DEV_GRAFANA_PORT:-13000}:3000"
    networks:
      - observability-backend
      - observability-loopback

networks:
  observability-ingest:
    name: contract-review-code-dev-observability-ingest
    driver: bridge
    internal: true
    labels:
      com.aituge.environment: test
      com.aituge.stack: contract-review-code-dev-observability
      com.aituge.network.role: ingest
  observability-backend:
    name: contract-review-code-dev-observability-backend
    driver: bridge
    internal: true
    labels:
      com.aituge.environment: test
      com.aituge.stack: contract-review-code-dev-observability
      com.aituge.network.role: backend
  observability-loopback:
    name: contract-review-code-dev-observability-loopback
    driver: bridge
    internal: false
    labels:
      com.aituge.environment: test
      com.aituge.stack: contract-review-code-dev-observability
      com.aituge.network.role: loopback

volumes:
  loki-data:
    name: contract-review-code-dev-observability-loki
    labels:
      com.aituge.environment: test
  alloy-data:
    name: contract-review-code-dev-observability-alloy
    labels:
      com.aituge.environment: test
  tempo-data:
    name: contract-review-code-dev-observability-tempo
    labels:
      com.aituge.environment: test
  prometheus-data:
    name: contract-review-code-dev-observability-prometheus
    labels:
      com.aituge.environment: test
  alertmanager-data:
    name: contract-review-code-dev-observability-alertmanager
    labels:
      com.aituge.environment: test
  grafana-data:
    name: contract-review-code-dev-observability-grafana
    labels:
      com.aituge.environment: test
  grafana-secret-runtime:
    name: contract-review-code-dev-observability-grafana-secret-runtime
    labels:
      com.aituge.environment: test

secrets:
  grafana_admin_password:
    name: contract-review-code-dev-grafana-admin-password
    file: ${CONTRACT_REVIEW_DEV_TEST_SECRETS_DIR:?required}/grafana_admin_password
