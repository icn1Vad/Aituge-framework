        correlation: {$ref: '#/components/schemas/Correlation'}
        outcome: {$ref: '#/components/schemas/Outcome'}
        errorCode: {type: string, nullable: true}
        durationMs: {type: integer, format: int64, minimum: 0, nullable: true}
        model: {$ref: '#/components/schemas/ModelMetadata'}
        metadata:
