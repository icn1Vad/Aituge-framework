openapi: 3.0.3
info:
  title: 管理员观测平台 API
  version: 0.7.0-draft
  description: |
    当前环境的管理员前端只调用当前环境的 Java API。环境由部署实例和域名确定，
    不接受 environment 查询参数。Java 负责认证、对象级授权、租户范围、事件注册表、
    脱敏、固定快照、跨源合并和签名游标。本草案不代表接口已经上线。
servers:
  - url: /monitor/observability
    description: 当前部署环境；测试和正式使用不同 Origin
security:
  - bearerAuth: []
x-observability-capability-policy:
  sensitiveNames: [cursor, retryToken, locator, accessContext, accessSession, X-Observability-Access-Context, X-Observability-Access-Session, highWatermark, querySnapshotId, downloadToken]
  accessLogReplacement: '[REDACTED]'
  requiredResponseHeaders:
    Cache-Control: 'no-store, private'
    Referrer-Policy: 'no-referrer'
    Vary: 'Authorization'
  description: Java Filter、网关、APM、Loki 和错误上报必须屏蔽能力型 Token；前端只保存在页面内存
tags:
  - {name: Overview}
  - {name: Events}
  - {name: Tasks}
  - {name: Models}
  - {name: Security}
  - {name: Runtime}
  - {name: Traces}
  - {name: Operations}
  - {name: Exports}

paths:
  /overview:
    get:
      tags: [Overview]
      summary: 获取当前环境观测总览
      operationId: getObservabilityOverview
      x-required-permissions: [monitor:observability:view]
      x-permission-conditioned-data:
        infrastructureCards: monitor:observability:operations
        securityCards: monitor:observability:security
        runtimeCards: monitor:observability:runtime
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/TenantScope'
        - $ref: '#/components/parameters/SelectedTenantIds'
        - $ref: '#/components/parameters/AccessReason'
        - $ref: '#/components/parameters/AccessSession'
      responses:
        '200':
          description: 总览；部分来源失败仍返回 200 并标记 partial
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OverviewResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}

  /events:
    get:
      tags: [Events]
      summary: 查询统一事件
      operationId: listUnifiedEvents
      x-required-permissions: [monitor:observability:view]
      x-fixed-sort:
        - {field: occurredAt, direction: DESC}
        - {field: sourceOrder, direction: DESC}
        - {field: eventId, direction: DESC}
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/TenantScope'
        - $ref: '#/components/parameters/SelectedTenantIds'
        - $ref: '#/components/parameters/AccessReason'
        - $ref: '#/components/parameters/AccessSession'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/RetryToken'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TraceId'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/RunId'
        - name: source
          in: query
          schema:
            type: array
            items: {$ref: '#/components/schemas/UnifiedEventSource'}
          style: form
          explode: false
        - {name: eventName, in: query, schema: {type: string}}
        - {name: category, in: query, schema: {type: string}}
        - name: level
          in: query
          schema:
            type: array
            items: {type: string, enum: [DEBUG, INFO, WARN, ERROR]}
          style: form
          explode: false
        - {name: errorCode, in: query, schema: {type: string}}
        - {name: privacyMode, in: query, schema: {$ref: '#/components/schemas/PrivacyMode'}}
        - {name: routeType, in: query, schema: {$ref: '#/components/schemas/RouteType'}}
        - {name: modelPackId, in: query, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/UnifiedEventList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}

  /events/{source}/{eventId}:
    get:
      tags: [Events]
      summary: 获取统一事件详情
      operationId: getUnifiedEvent
      x-required-permissions: [monitor:observability:detail]
      parameters:
        - {name: source, in: path, required: true, schema: {$ref: '#/components/schemas/UnifiedEventSource'}}
        - $ref: '#/components/parameters/EventIdPath'
        - $ref: '#/components/parameters/AccessContext'
      responses:
        '200': {$ref: '#/components/responses/UnifiedEventDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrInvisible'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}

  /tasks:
    get:
      tags: [Tasks]
      summary: 查询跨功能任务
      operationId: listObservabilityTasks
      x-required-permissions: [monitor:observability:view]
      x-fixed-sort:
        - {field: createdAt, direction: DESC}
        - {field: taskId, direction: DESC}
      description: 首次查询按固定排序物化短期有界结果清单，冻结有序 taskId、projectionVersion 和返回摘要；后续页只按该清单读取。
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/TenantScope'
        - $ref: '#/components/parameters/SelectedTenantIds'
        - $ref: '#/components/parameters/AccessReason'
        - $ref: '#/components/parameters/AccessSession'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/RetryToken'
        - $ref: '#/components/parameters/Limit'
        - {name: featureCode, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string}}
        - {name: errorCode, in: query, schema: {type: string}}
      responses:
        '200':
          description: 任务列表
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}

  /tasks/{taskId}:
    get:
      tags: [Tasks]
      summary: 获取任务详情
      operationId: getObservabilityTask
      x-required-permissions: [monitor:observability:detail]
      x-detail-consistency: LATEST
      description: 默认返回请求时的最新 Task 投影及 projectionVersion/dataAsOf，不提供列表 snapshotTo 的 as-of 详情；若版本不同，前端提示状态已更新。
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
        - $ref: '#/components/parameters/AccessContext'
      responses:
        '200':
          description: 任务详情
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaskSummary'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrInvisible'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}

  /tasks/{taskId}/timeline:
    get:
      tags: [Tasks]
      summary: 获取以 taskId 为主键拼接的跨服务时间线
      operationId: getTaskTimeline
      x-required-permissions: [monitor:observability:detail]
      x-fixed-sort:
        - {field: sequence, direction: ASC}
        - {field: eventId, direction: ASC}
      parameters:
        - $ref: '#/components/parameters/TaskIdPath'
        - $ref: '#/components/parameters/AccessContext'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/RetryToken'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': {$ref: '#/components/responses/Timeline'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrInvisible'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}

  /runs/{runId}/stages:
    get:
      tags: [Tasks]
      summary: 获取 Run 阶段
      operationId: listRunStages
      x-required-permissions: [monitor:observability:detail]
      parameters:
        - $ref: '#/components/parameters/RunIdPath'
        - $ref: '#/components/parameters/AccessContext'
      responses:
        '200':
          description: 阶段列表
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StageListResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrInvisible'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}

  /runs/{runId}/events:
    get:
      tags: [Tasks]
      summary: 获取 Run 持久事件
      operationId: listRunEvents
      x-required-permissions: [monitor:observability:detail]
      x-fixed-sort:
        - {field: sequence, direction: ASC}
        - {field: eventId, direction: ASC}
      parameters:
        - $ref: '#/components/parameters/RunIdPath'
        - $ref: '#/components/parameters/AccessContext'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/RetryToken'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': {$ref: '#/components/responses/UnifiedEventList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrInvisible'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}

  /runs/{runId}/events/stream:
    get:
      tags: [Tasks]
      summary: 订阅单个 Run 的增量事件
      operationId: streamRunEvents
      x-required-permissions: [monitor:observability:detail]
      description: |
        前端必须使用 fetch() + ReadableStream 携带 Authorization Header，不使用原生 EventSource。
        SSE 事件必须包含 id、event、data.sequence、data.occurredAt 和 data.event；SSE id 的值就是 eventId。
        每 15 秒发送 heartbeat；支持 Last-Event-ID 断线恢复；单连接最长 30 分钟，
        到期发送 reconnect 事件后关闭。Last-Event-ID 必须提交最后收到的 eventId，服务端由 eventId
        定位对应 sequence 后继续；客户端按 eventId + sequence 去重，不能把 sequence 当成 Last-Event-ID。
        Last-Event-ID 可识别但超出重放窗口时，握手返回 409 EVENT_STREAM_REPLAY_GAP；事件已清理、
        无法定位或 Run 已归档时返回 410 EVENT_STREAM_RESET_REQUIRED。建连后发现缺口时发送
        reset-required 事件并关闭，前端必须转为分页恢复。每连接积压上限为 1000 个事件或 5 MiB，
        慢客户端连续 30 秒无消费进展时断开。部署必须禁用代理缓冲和不适当压缩。
      parameters:
        - $ref: '#/components/parameters/RunIdPath'
        - $ref: '#/components/parameters/AccessContext'
        - {name: Last-Event-ID, in: header, schema: {type: string}}
      responses:
        '200':
          description: Server-Sent Events
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            Cache-Control: {schema: {type: string, enum: ['no-cache, no-store, private']}}
            X-Accel-Buffering: {schema: {type: string, enum: ['no']}}
          content:
            text/event-stream:
              schema: {type: string}
              example: "id: evt_01\nevent: task-event\ndata: {\"sequence\":42,\"occurredAt\":\"2026-07-31T01:02:03Z\",\"event\":{\"eventId\":\"evt_01\"}}\n\n"
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrInvisible'}
        '409': {$ref: '#/components/responses/StreamReplayGap'}
        '410': {$ref: '#/components/responses/StreamResetRequired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}

  /model-summary:
    get:
      tags: [Models]
      summary: 获取模型调用汇总
      operationId: getModelInvocationSummary
      x-required-permissions: [monitor:observability:view]
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/TenantScope'
        - $ref: '#/components/parameters/SelectedTenantIds'
        - $ref: '#/components/parameters/AccessReason'
        - $ref: '#/components/parameters/AccessSession'
        - {name: featureCode, in: query, schema: {type: string}}
        - {name: provider, in: query, schema: {type: string}}
        - {name: modelPackId, in: query, schema: {type: string}}
        - {name: modelName, in: query, schema: {type: string}}
        - {name: privacyMode, in: query, schema: {$ref: '#/components/schemas/PrivacyMode'}}
        - {name: routeType, in: query, schema: {$ref: '#/components/schemas/RouteType'}}
      responses:
        '200':
          description: 分别提供逻辑调用、调度尝试、已确认实际请求和调度未知口径
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModelSummaryResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}

  /model-invocations:
    get:
      tags: [Models]
      summary: 查询模型调度尝试；一行对应一个 invocation
      operationId: listModelInvocations
      x-required-permissions: [monitor:observability:view]
      x-fixed-sort:
        - {field: startedAt, direction: DESC}
        - {field: invocationId, direction: DESC}
      description: invocation 表示进入模型调度边界的一次尝试；实际 Provider/本地执行请求只统计 dispatchStatus=DISPATCHED，DISPATCH_UNKNOWN 单列。首次查询物化有界结果清单，后续页不重查可变投影。
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/TenantScope'
        - $ref: '#/components/parameters/SelectedTenantIds'
        - $ref: '#/components/parameters/AccessReason'
        - $ref: '#/components/parameters/AccessSession'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/RetryToken'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/TraceId'
        - {name: logicalCallId, in: query, schema: {type: string}}
        - {name: invocationId, in: query, schema: {type: string}}
        - {name: lifecycleStatus, in: query, schema: {$ref: '#/components/schemas/InvocationLifecycleStatus'}}
        - {name: dispatchStatus, in: query, schema: {$ref: '#/components/schemas/DispatchStatus'}}
        - {name: outcome, in: query, schema: {$ref: '#/components/schemas/Outcome'}}
        - {name: privacyMode, in: query, schema: {$ref: '#/components/schemas/PrivacyMode'}}
        - {name: routeType, in: query, schema: {$ref: '#/components/schemas/RouteType'}}
        - {name: provider, in: query, schema: {type: string}}
        - {name: modelPackId, in: query, schema: {type: string}}
        - {name: modelName, in: query, schema: {type: string}}
        - {name: featureCode, in: query, schema: {type: string}}
        - {name: stageId, in: query, schema: {type: string}}
        - {name: errorCode, in: query, schema: {type: string}}
      responses:
        '200': {$ref: '#/components/responses/ModelInvocationList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}

  /model-invocations/{invocationId}:
    get:
      tags: [Models]
      summary: 获取一次模型调度尝试的生命周期
      operationId: getModelInvocation
      x-required-permissions: [monitor:observability:detail]
      x-detail-consistency: LATEST
      description: 默认返回最新 invocation 投影及 projectionVersion/dataAsOf，并附追加式生命周期；不提供列表 snapshotTo 的 as-of 详情。
      parameters:
        - {name: invocationId, in: path, required: true, schema: {type: string}}
        - $ref: '#/components/parameters/AccessContext'
      responses:
        '200': {$ref: '#/components/responses/ModelInvocationDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrInvisible'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}

  /security-events:
    get:
      tags: [Security]
      summary: 查询安全审计事件
      operationId: listSecurityEvents
      x-required-permissions: [monitor:observability:security]
      x-fixed-sort:
        - {field: occurredAt, direction: DESC}
        - {field: eventId, direction: DESC}
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/TenantScope'
        - $ref: '#/components/parameters/SelectedTenantIds'
        - $ref: '#/components/parameters/AccessReason'
        - $ref: '#/components/parameters/AccessSession'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/RetryToken'
        - $ref: '#/components/parameters/Limit'
        - {name: scopeType, in: query, schema: {type: string, enum: [TENANT, SYSTEM]}}
        - {name: category, in: query, schema: {type: string}}
        - {name: riskLevel, in: query, schema: {type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL]}}
        - {name: actorId, in: query, schema: {type: string}}
        - {name: crossTenant, in: query, schema: {type: boolean}}
        - {name: action, in: query, schema: {type: string}}
        - {name: outcome, in: query, schema: {$ref: '#/components/schemas/Outcome'}}
        - {name: subjectType, in: query, schema: {type: string}}
        - {name: subjectId, in: query, schema: {type: string}}
        - {name: reasonCode, in: query, schema: {type: string}}
        - {name: sourceIpMasked, in: query, schema: {type: string, maxLength: 64}}
        - {name: auditActionId, in: query, schema: {type: string}}
        - {name: accessSessionId, in: query, schema: {type: string}}
        - {name: auditLayer, in: query, schema: {$ref: '#/components/schemas/AuditLayer'}}
      responses:
        '200': {$ref: '#/components/responses/SecurityEventList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}

  /security-events/{eventId}:
    get:
      tags: [Security]
      summary: 获取安全审计详情
      operationId: getSecurityEvent
      x-required-permissions: [monitor:observability:security, monitor:observability:detail]
      parameters:
        - $ref: '#/components/parameters/EventIdPath'
        - $ref: '#/components/parameters/AccessContext'
      responses:
        '200': {$ref: '#/components/responses/SecurityEventDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrInvisible'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}

  /runtime-logs/search:
    post:
      tags: [Runtime]
      summary: 查询当前环境 Loki 运行日志
      operationId: searchRuntimeLogs
      x-required-permissions: [monitor:observability:runtime]
      x-fixed-sort:
        - {field: occurredAt, direction: DESC}
        - {field: sourceTieBreaker, direction: DESC}
      description: 关键词位于 Body；Java 根据白名单生成 LogQL，前端不能传原始 LogQL。签名 locator 封装来源稳定 tie-breaker。
      parameters:
        - $ref: '#/components/parameters/AccessReason'
        - $ref: '#/components/parameters/AccessSession'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuntimeLogSearchRequest'}
      responses:
        '200': {$ref: '#/components/responses/RuntimeLogList'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}

  /runtime-logs/detail:
    post:
      tags: [Runtime]
      summary: 获取一条运行日志的脱敏详情
      operationId: getRuntimeLog
      x-required-permissions: [monitor:observability:runtime, monitor:observability:detail]
      parameters:
        - $ref: '#/components/parameters/AccessContext'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RuntimeLogDetailRequest'}
      responses:
        '200': {$ref: '#/components/responses/RuntimeLogDetail'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrInvisible'}
        '410': {$ref: '#/components/responses/RuntimeLocatorExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}

  /traces:
    get:
      tags: [Traces]
      summary: 查询当前环境 Trace
      operationId: listTraces
      x-required-permissions: [monitor:observability:view]
      x-fixed-sort:
        - {field: startedAt, direction: DESC}
        - {field: traceId, direction: DESC}
      description: 当前契约允许返回尚未结束、status=UNSET 的 Trace，因此首次查询必须按固定排序物化返回摘要；后续页不得读取继续变化的当前值。
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/TenantScope'
        - $ref: '#/components/parameters/SelectedTenantIds'
        - $ref: '#/components/parameters/AccessReason'
        - $ref: '#/components/parameters/AccessSession'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/RetryToken'
        - $ref: '#/components/parameters/Limit'
        - {name: service, in: query, schema: {type: string}}
        - {name: minDurationMs, in: query, schema: {type: integer, minimum: 0}}
        - {name: errorOnly, in: query, schema: {type: boolean}}
      responses:
        '200':
          description: Trace 列表
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TraceListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}

  /traces/{traceId}:
    get:
      tags: [Traces]
      summary: 获取单个局部 Trace 与 Span Link
      operationId: getTrace
      x-required-permissions: [monitor:observability:detail]
      x-detail-consistency: LATEST
      description: 默认返回最新 Trace 投影及 projectionVersion/dataAsOf；不提供列表 snapshotTo 的 as-of 详情，运行中 Trace 可能已更新。
      parameters:
        - $ref: '#/components/parameters/TraceIdPath'
        - $ref: '#/components/parameters/AccessContext'
      responses:
        '200':
          description: Trace 详情；不含请求/响应正文
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TraceDetail'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrInvisible'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}

  /timeline:
    get:
      tags: [Traces]
      summary: 根据 taskId/runId 等关联键获取跨 Trace 时间线
      operationId: getCorrelationTimeline
      x-required-permissions: [monitor:observability:detail]
      x-fixed-sort:
        - {field: occurredAt, direction: ASC}
        - {field: sourceOrder, direction: ASC}
        - {field: eventId, direction: ASC}
      x-at-least-one-parameter: [taskId, runId, requestId, traceId, reviewId]
      description: taskId、runId、requestId、traceId、reviewId 至少提供一个；全部为空时返回 400 OBSERVABILITY_CORRELATION_REQUIRED。
      parameters:
        - $ref: '#/components/parameters/AccessContext'
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/TraceId'
        - {name: reviewId, in: query, schema: {type: string}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/RetryToken'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': {$ref: '#/components/responses/Timeline'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrInvisible'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}

  /services:
    get:
      tags: [Operations]
      summary: 获取当前环境服务和 Worker 健康状态
      operationId: listServiceHealth
      x-required-permissions: [monitor:observability:operations]
      responses:
        '200':
          description: 服务健康
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceHealthResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}

  /alerts:
    get:
      tags: [Operations]
      summary: 获取当前环境告警
      operationId: listAlerts
      x-required-permissions: [monitor:observability:operations]
      x-fixed-sort:
        - {field: startedAt, direction: DESC}
        - {field: alertId, direction: DESC}
      description: Alert 状态和 resolvedAt 会更新；首次查询必须按固定排序物化返回摘要，后续页不得重查当前状态。
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/RetryToken'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 告警列表；本期不提供确认或静默写接口
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AlertListResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}

  /storage:
    get:
      tags: [Operations]
      summary: 获取当前环境观测存储容量和留存
      operationId: getObservabilityStorage
      x-required-permissions: [monitor:observability:operations]
      responses:
        '200':
          description: 存储状态
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StorageResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}

  /exports:
    post:
      tags: [Exports]
      summary: 创建当前环境异步元数据导出
      operationId: createObservabilityExport
      x-required-permissions: [monitor:observability:export]
      x-resource-permission-rules:
        EVENTS: [monitor:observability:view]
        TASKS: [monitor:observability:view]
        MODEL_INVOCATIONS: [monitor:observability:view]
        SECURITY_EVENTS: [monitor:observability:security]
        RUNTIME_LOGS: [monitor:observability:runtime]
        TRACES: [monitor:observability:detail]
        ALERTS: [monitor:observability:operations]
      description: |
        导出权限必须叠加目标资源权限和跨租户权限；export 本身不提升可见范围。
        Java 在返回 202 前立即创建并持久化查询快照，异步 Worker 只能按该快照导出。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AccessReason'
        - $ref: '#/components/parameters/AccessSession'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExportRequest'}
      responses:
        '202':
          description: 已创建或返回相同幂等键对应任务
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportJob'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}
        '503': {$ref: '#/components/responses/SourceUnavailable'}

  /exports/{exportId}:
    get:
      tags: [Exports]
      summary: 获取导出任务状态
      operationId: getObservabilityExport
      x-required-permissions: [monitor:observability:export]
      x-resource-permission-rules:
        EVENTS: [monitor:observability:view]
        TASKS: [monitor:observability:view]
        MODEL_INVOCATIONS: [monitor:observability:view]
        SECURITY_EVENTS: [monitor:observability:security]
        RUNTIME_LOGS: [monitor:observability:runtime]
        TRACES: [monitor:observability:detail]
        ALERTS: [monitor:observability:operations]
      x-authorization-rules:
        - 重新校验导出权限、目标资源原权限、当前租户范围以及创建者或获准下载者身份
      parameters:
        - $ref: '#/components/parameters/ExportIdPath'
      responses:
        '200':
          description: 不直接返回对象存储地址
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExportJob'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrInvisible'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}

  /exports/{exportId}/download:
    get:
      tags: [Exports]
      summary: 经 Java 鉴权和审计后下载导出文件
      operationId: downloadObservabilityExport
      x-required-permissions: [monitor:observability:export]
      x-resource-permission-rules:
        EVENTS: [monitor:observability:view]
        TASKS: [monitor:observability:view]
        MODEL_INVOCATIONS: [monitor:observability:view]
        SECURITY_EVENTS: [monitor:observability:security]
        RUNTIME_LOGS: [monitor:observability:runtime]
        TRACES: [monitor:observability:detail]
        ALERTS: [monitor:observability:operations]
      x-authorization-rules:
        - 重新校验导出权限、目标资源原权限、当前租户范围、创建者或获准下载者身份以及文件有效期
        - 实际下载成功或拒绝都必须写入安全审计
      parameters:
        - $ref: '#/components/parameters/ExportIdPath'
      responses:
        '200':
          description: Java 流式返回文件
          headers:
            X-Request-ID: {$ref: '#/components/headers/RequestId'}
            Content-Disposition:
              schema: {type: string}
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '302':
          description: 可选的一次性短期地址；签发前已完成鉴权和下载审计
          headers:
            Location:
              schema: {type: string, format: uri}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFoundOrInvisible'}
        '410': {$ref: '#/components/responses/ExportExpired'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        '500': {$ref: '#/components/responses/InternalError'}

components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}

  headers:
    RequestId:
      description: 当前请求的服务端 request ID
      schema: {type: string}

  parameters:
    From:
      name: from
      in: query
      description: ISO 8601；默认最近 24 小时
      schema: {type: string, format: date-time}
    To:
      name: to
      in: query
      schema: {type: string, format: date-time}
    TenantScope:
      name: tenantScope
      in: query
      description: 租户管理员必须省略；仅超级管理员可使用。SELECTED/ALL 必须提供原因 Header。
      schema: {type: string, enum: [CURRENT, SELECTED, ALL], default: CURRENT}
    SelectedTenantIds:
      name: selectedTenantIds
      in: query
      description: 仅 tenantScope=SELECTED 时使用
      schema:
        type: array
        maxItems: 50
        items: {type: string}
      style: form
      explode: false
    AccessReason:
      name: X-Observability-Access-Reason
      in: header
      description: 新建跨租户 Access Session 时使用；Java 归一化为 AccessReasonContext。有效 Access Session 的同 Scope/筛选自动刷新可省略。格式为受控原因码加工单/事件编号，不允许在 URL 或 Body 重复
      schema: {type: string, minLength: 5, maxLength: 100, pattern: '^(TICKET|INCIDENT|AUDIT|SUPPORT):[A-Za-z0-9._-]+$'}
    AccessSession:
      name: X-Observability-Access-Session
      in: header
      description: 跨租户轮询复用的短期签名能力 Token；绑定用户、权限、Scope、原因和筛选摘要。敏感详情与写操作仍创建新的 auditActionId；任何日志和 APM 均不得记录原值
      schema: {type: string, minLength: 20, maxLength: 4096}
    AccessContext:
      name: X-Observability-Access-Context
      in: header
      description: 列表签发的短期签名能力 Token；跨租户详情必填，绑定用户、权限、原查询租户范围、原因、筛选摘要和环境；任何日志和 APM 均不得记录原值
      schema: {type: string, minLength: 20, maxLength: 4096}
    Cursor:
      name: cursor
      in: query
      description: 进入下一页；与 retryToken 互斥。属于短期能力 Token，网关、应用日志和 APM 必须按参数名屏蔽
      schema: {type: string, minLength: 16, maxLength: 4096}
    RetryToken:
      name: retryToken
      in: query
      description: 重新执行当前未完成页；与 cursor 互斥。属于短期能力 Token，任何日志和 APM 均不得记录原值
      schema: {type: string, minLength: 16, maxLength: 4096}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    RequestId: {name: requestId, in: query, schema: {type: string}}
    TraceId: {name: traceId, in: query, schema: {type: string}}
    TaskId: {name: taskId, in: query, schema: {type: string}}
    RunId: {name: runId, in: query, schema: {type: string}}
    EventIdPath: {name: eventId, in: path, required: true, schema: {type: string}}
    TaskIdPath: {name: taskId, in: path, required: true, schema: {type: string}}
    RunIdPath: {name: runId, in: path, required: true, schema: {type: string}}
    TraceIdPath: {name: traceId, in: path, required: true, schema: {type: string}}
    ExportIdPath: {name: exportId, in: path, required: true, schema: {type: string}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 相同用户、租户范围和请求体在有效期内返回同一导出任务
      schema: {type: string, minLength: 16, maxLength: 128}

  responses:
    UnifiedEventList:
      description: 固定快照的统一列表
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/UnifiedEventListResponse'}
    UnifiedEventDetail:
      description: 默认只返回登记过且脱敏的元数据
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/UnifiedEvent'}
    ModelInvocationList:
      description: 一行对应一个模型调度 invocation；dispatchStatus 决定是否计入已确认实际请求
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ModelInvocationListResponse'}
    ModelInvocationDetail:
      description: invocation 投影摘要和追加式生命周期事件
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ModelInvocationDetailResponse'}
    SecurityEventList:
      description: 严格结构化的安全审计列表
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SecurityEventListResponse'}
    SecurityEventDetail:
      description: 经对象级授权后的安全审计详情
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/SecurityEvent'}
    RuntimeLogList:
      description: 经 LogQL 白名单查询和双重脱敏的运行日志列表
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RuntimeLogListResponse'}
    RuntimeLogDetail:
      description: 经签名 locator 定位且二次脱敏的运行日志详情
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/RuntimeLogEntry'}
    Timeline:
      description: 按 task/run 拼接的事件与局部 Trace 时间线
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TimelineResponse'}
    BadRequest: {$ref: '#/components/responses/Error400'}
    Unauthorized: {$ref: '#/components/responses/Error401'}
    Forbidden: {$ref: '#/components/responses/Error403'}
    NotFoundOrInvisible: {$ref: '#/components/responses/Error404'}
    IdempotencyConflict: {$ref: '#/components/responses/Error409'}
    ExportExpired: {$ref: '#/components/responses/Error410'}
    StreamReplayGap: {$ref: '#/components/responses/ErrorStreamReplayGap'}
    StreamResetRequired: {$ref: '#/components/responses/ErrorStreamResetRequired'}
    RuntimeLocatorExpired: {$ref: '#/components/responses/ErrorRuntimeLocatorExpired'}
    TooManyRequests: {$ref: '#/components/responses/Error429'}
    InternalError: {$ref: '#/components/responses/Error500'}
    SourceUnavailable: {$ref: '#/components/responses/Error503'}
    Error400:
      description: 参数、游标或查询范围无效
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Error401:
      description: 未认证或会话失效
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Error403:
      description: 列表范围或操作权限被拒绝；会记录边界审计
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Error404:
      description: 资源不存在或对调用者不可见；两者对外不区分
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Error409:
      description: 相同 Idempotency-Key 对应不同请求体
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Error410:
      description: 导出文件已过期
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    ErrorStreamReplayGap:
      description: Last-Event-ID 可识别但超出可重放窗口；错误码 EVENT_STREAM_REPLAY_GAP，客户端必须先分页补齐
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    ErrorStreamResetRequired:
      description: Last-Event-ID 已清理、无法定位或 Run 已归档；错误码 EVENT_STREAM_RESET_REQUIRED，客户端必须重建状态
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    ErrorRuntimeLocatorExpired:
      description: Runtime locator 已过期；错误码 RUNTIME_LOG_LOCATOR_EXPIRED。无权对象仍返回 404
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Error429:
      description: 超出查询预算、速率或快照容量；快照容量超限使用稳定错误码 OBSERVABILITY_SNAPSHOT_CAPACITY_EXCEEDED
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
        Retry-After: {schema: {type: integer}}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Error500:
      description: Java 聚合服务内部错误
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Error503:
      description: 所请求的唯一数据源未接入或不可用
      headers:
        X-Request-ID: {$ref: '#/components/headers/RequestId'}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}

  schemas:
    UnifiedEventSource:
      type: string
      description: 安全事件和运行日志有独立权限及接口，不允许通过统一事件中心绕过
      enum: [HTTP_AUDIT, BUSINESS_EVENT, TASK_EVENT, MODEL_EVENT]
    Outcome:
      type: string
      enum: [SUCCESS, FAILURE, DENIED, CANCELLED, TIMEOUT, PARTIAL, UNKNOWN, ABANDONED]
    InvocationLifecycleStatus:
      type: string
      description: RUNNING 表示仍在执行；TERMINAL 才允许填写 outcome
