      required: [locator]
      properties:
        locator: {type: string, minLength: 20, maxLength: 4096, description: 短期签名能力 Token；只能放在 Body 且任何日志/APM 不得记录原值}
    TraceSummary:
      type: object
      additionalProperties: false
      required: [traceId, projectionVersion, dataAsOf, entrySpan, serviceCount, startedAt, durationMs, status]
      properties:
        traceId: {type: string}
        projectionVersion: {type: integer, format: int64, minimum: 1, description: 列表中为冻结摘要版本；详情中为最新 Trace 版本}
        dataAsOf: {type: string, format: date-time, description: 列表中为冻结摘要的数据时点；详情中为最新 Trace 读取时点}
        entrySpan: {type: string}
        serviceCount: {type: integer, minimum: 0}
        startedAt: {type: string, format: date-time}
        durationMs: {type: integer, format: int64, minimum: 0}
        status: {type: string, enum: [OK, ERROR, UNSET]}
        taskId: {type: string, nullable: true}
        runId: {type: string, nullable: true}
    TraceListResponse:
      type: object
      additionalProperties: false
      required: [data, page, query, sourceStatus]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/TraceSummary'}}
        page: {$ref: '#/components/schemas/PageInfo'}
        query: {$ref: '#/components/schemas/QuerySnapshot'}
        sourceStatus: {$ref: '#/components/schemas/SourceStatus'}
        accessContext: {type: string, nullable: true}
    SpanLink:
      type: object
      additionalProperties: false
      required: [traceId, spanId, relation]
      properties:
        traceId: {type: string}
        spanId: {type: string}
        relation: {type: string, enum: [UPSTREAM, RETRY, CALLBACK]}
    Span:
      type: object
      additionalProperties: false
      required: [spanId, parentSpanId, name, service, startedAt, durationMs, status, links, attributes]
      properties:
        spanId: {type: string}
        parentSpanId: {type: string, nullable: true}
        name: {type: string}
        service: {type: string}
        startedAt: {type: string, format: date-time}
        durationMs: {type: integer, format: int64, minimum: 0}
        status: {type: string, enum: [OK, ERROR, UNSET]}
        links: {type: array, items: {$ref: '#/components/schemas/SpanLink'}}
        attributes: {type: array, items: {$ref: '#/components/schemas/MetadataField'}}
    TraceDetail:
      type: object
      additionalProperties: false
      required: [summary, spans, sourceStatus]
      properties:
        summary: {$ref: '#/components/schemas/TraceSummary'}
        spans: {type: array, items: {$ref: '#/components/schemas/Span'}}
        sourceStatus: {$ref: '#/components/schemas/SourceStatus'}
    ServiceHealth:
      type: object
      additionalProperties: false
      required: [service, instance, version, status, lastCheckAt]
      properties:
        service: {type: string}
        instance: {type: string}
        version: {type: string}
        status: {type: string, enum: [UP, DEGRADED, DOWN, UNKNOWN]}
        lastCheckAt: {type: string, format: date-time}
    ServiceHealthResponse:
      type: object
      additionalProperties: false
      required: [data, sourceStatus]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/ServiceHealth'}}
        sourceStatus: {$ref: '#/components/schemas/SourceStatus'}
    AlertSummary:
      type: object
      additionalProperties: false
      required: [alertId, projectionVersion, dataAsOf, ruleName, severity, status, startedAt, resolvedAt, service, displayCode]
      properties:
        alertId: {type: string}
        projectionVersion: {type: integer, format: int64, minimum: 1}
        dataAsOf: {type: string, format: date-time, description: 物化列表摘要的数据时点}
        ruleName: {type: string}
        severity: {type: string, enum: [INFO, WARNING, CRITICAL]}
        status: {type: string, enum: [FIRING, RESOLVED]}
        startedAt: {type: string, format: date-time}
        resolvedAt: {type: string, format: date-time, nullable: true}
        service: {type: string}
        displayCode: {type: string}
    AlertListResponse:
      type: object
      additionalProperties: false
      required: [data, page, query, sourceStatus]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/AlertSummary'}}
        page: {$ref: '#/components/schemas/PageInfo'}
        query: {$ref: '#/components/schemas/QuerySnapshot'}
        sourceStatus: {$ref: '#/components/schemas/SourceStatus'}
    StorageItem:
      type: object
      additionalProperties: false
      required: [source, status, retentionDays, oldestDataAt, newestDataAt, usedBytes]
      properties:
        source: {type: string}
        status: {type: string, enum: [OK, WARNING, ERROR, UNKNOWN]}
        retentionDays: {type: integer}
        oldestDataAt: {type: string, format: date-time, nullable: true}
        newestDataAt: {type: string, format: date-time, nullable: true}
        usedBytes: {type: integer, format: int64, nullable: true}
    StorageResponse:
      type: object
      additionalProperties: false
      required: [data, sourceStatus]
      properties:
        data: {type: array, items: {$ref: '#/components/schemas/StorageItem'}}
        sourceStatus: {$ref: '#/components/schemas/SourceStatus'}
    ExportRequest:
      type: object
      additionalProperties: false
      required: [resource, format, from, to, filter]
      properties:
        resource: {type: string, enum: [EVENTS, TASKS, MODEL_INVOCATIONS, SECURITY_EVENTS, RUNTIME_LOGS, TRACES, ALERTS]}
        format: {type: string, enum: [CSV, JSONL]}
        from: {type: string, format: date-time}
        to: {type: string, format: date-time}
        tenantScope: {type: string, enum: [CURRENT, SELECTED, ALL], default: CURRENT}
        selectedTenantIds: {type: array, maxItems: 50, items: {type: string}}
        filter:
          description: filterType 必须与 resource 一致；未知字段返回 400，不能静默忽略
          oneOf:
            - $ref: '#/components/schemas/EventExportFilter'
            - $ref: '#/components/schemas/TaskExportFilter'
            - $ref: '#/components/schemas/ModelExportFilter'
            - $ref: '#/components/schemas/SecurityExportFilter'
            - $ref: '#/components/schemas/RuntimeLogExportFilter'
            - $ref: '#/components/schemas/TraceExportFilter'
            - $ref: '#/components/schemas/AlertExportFilter'
          discriminator:
            propertyName: filterType
            mapping:
              EVENTS: '#/components/schemas/EventExportFilter'
              TASKS: '#/components/schemas/TaskExportFilter'
              MODEL_INVOCATIONS: '#/components/schemas/ModelExportFilter'
              SECURITY_EVENTS: '#/components/schemas/SecurityExportFilter'
              RUNTIME_LOGS: '#/components/schemas/RuntimeLogExportFilter'
              TRACES: '#/components/schemas/TraceExportFilter'
              ALERTS: '#/components/schemas/AlertExportFilter'
    EventExportFilter:
      type: object
      additionalProperties: false
      required: [filterType]
      properties:
        filterType: {type: string, enum: [EVENTS]}
        sources: {type: array, items: {$ref: '#/components/schemas/UnifiedEventSource'}}
        eventName: {type: string}
        level: {type: string, enum: [DEBUG, INFO, WARN, ERROR]}
        errorCode: {type: string}
        taskId: {type: string}
        runId: {type: string}
    TaskExportFilter:
      type: object
      additionalProperties: false
      required: [filterType]
      properties:
        filterType: {type: string, enum: [TASKS]}
        featureCode: {type: string}
        status: {type: string}
        errorCode: {type: string}
    ModelExportFilter:
      type: object
      additionalProperties: false
      required: [filterType]
      properties:
        filterType: {type: string, enum: [MODEL_INVOCATIONS]}
        provider: {type: string}
        modelPackId: {type: string}
        modelName: {type: string}
        featureCode: {type: string}
        lifecycleStatus: {$ref: '#/components/schemas/InvocationLifecycleStatus'}
        outcome: {$ref: '#/components/schemas/Outcome'}
        privacyMode: {$ref: '#/components/schemas/PrivacyMode'}
        routeType: {$ref: '#/components/schemas/RouteType'}
        errorCode: {type: string}
    SecurityExportFilter:
      type: object
      additionalProperties: false
      required: [filterType]
      properties:
        filterType: {type: string, enum: [SECURITY_EVENTS]}
        category: {type: string}
        action: {type: string}
        riskLevel: {type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL]}
        outcome: {$ref: '#/components/schemas/Outcome'}
        actorId: {type: string}
        subjectType: {type: string}
        subjectId: {type: string}
        reasonCode: {type: string}
        crossTenant: {type: boolean}
    RuntimeLogExportFilter:
      type: object
      additionalProperties: false
      required: [filterType]
      properties:
        filterType: {type: string, enum: [RUNTIME_LOGS]}
        service: {type: string}
        container: {type: string}
        level: {type: string, enum: [DEBUG, INFO, WARN, ERROR]}
        logger: {type: string}
        keyword: {type: string, maxLength: 128}
        requestId: {type: string}
        traceId: {type: string}
        taskId: {type: string}
    TraceExportFilter:
      type: object
      additionalProperties: false
      required: [filterType]
      properties:
        filterType: {type: string, enum: [TRACES]}
        service: {type: string}
        minDurationMs: {type: integer, minimum: 0}
        errorOnly: {type: boolean}
        taskId: {type: string}
        runId: {type: string}
    AlertExportFilter:
      type: object
      additionalProperties: false
      required: [filterType]
      properties:
        filterType: {type: string, enum: [ALERTS]}
        severity: {type: string, enum: [INFO, WARNING, CRITICAL]}
        status: {type: string, enum: [FIRING, RESOLVED]}
        service: {type: string}
    AuthorizedTenantScope:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope: {type: string, enum: [CURRENT, SELECTED, ALL]}
        selectedTenantIds: {type: array, items: {type: string}}
    ExportJob:
      type: object
      additionalProperties: false
      required: [exportId, status, querySnapshotId, snapshotTo, filterHash, authorizedTenantScope, requiredResourcePermissions, schemaVersion, dataVersion, createdAt, expiresAt]
      properties:
        exportId: {type: string}
        status: {type: string, enum: [PENDING, RUNNING, SUCCEEDED, FAILED, EXPIRED]}
        querySnapshotId: {type: string, description: 创建任务时已持久化的不可变查询快照}
        snapshotTo: {type: string, format: date-time}
        filterHash: {type: string}
        authorizedTenantScope: {$ref: '#/components/schemas/AuthorizedTenantScope'}
        requiredResourcePermissions: {type: array, items: {type: string}}
        schemaVersion: {type: integer, minimum: 1}
        dataVersion: {type: string}
        createdAt: {type: string, format: date-time}
        expiresAt: {type: string, format: date-time, nullable: true}
        downloadPath: {type: string, nullable: true, example: /monitor/observability/exports/exp_01/download}
        errorCode: {type: string, nullable: true}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, displayCode, requestId]
      properties:
        code: {type: string}
        displayCode: {type: string}
        displayArgs: {type: array, items: {$ref: '#/components/schemas/MetadataField'}}
        requestId: {type: string}
