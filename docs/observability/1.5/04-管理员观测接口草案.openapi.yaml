        occurredAt: {type: string, format: date-time}
        ingestedAt: {type: string, format: date-time}
        source: {$ref: '#/components/schemas/UnifiedEventSource'}
        service: {type: string}
        serviceVersion: {type: string, nullable: true}
        environment: {type: string, enum: [test, formal], readOnly: true}
        eventName: {type: string}
        schemaVersion: {type: integer, minimum: 1}
        level: {type: string, enum: [DEBUG, INFO, WARN, ERROR]}
        displayCode: {type: string}
        displayArgs:
          type: array
          items: {$ref: '#/components/schemas/MetadataField'}
        displayMessage: {type: string, maxLength: 512, nullable: true, description: 服务端按注册模板生成并脱敏；事件类不返回原始异常}
        tenantId: {type: string, nullable: true}
        scopeType: {type: string, enum: [TENANT, SYSTEM]}
        actor: {$ref: '#/components/schemas/Actor'}
