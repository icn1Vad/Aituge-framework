[project]
name = "aituge-framework"
version = "0.1.0"
description = "TUGE single-agent, scheduling, tool, RAG, and discussion framework."
requires-python = ">=3.11,<3.13"
readme = "README.md"

[tool.poetry]
name = "aituge-framework"
version = "0.1.0"
description = "TUGE single-agent, scheduling, tool, RAG, and discussion framework."
authors = ["AI-tuge"]
packages = [
  {include = "aituge_model"},
  {include = "backend"},
  {include = "api", from = "backend/single-agent"},
  {include = "agent", from = "backend/single-agent"},
  {include = "common", from = "backend/single-agent"},
  {include = "db", from = "backend/single-agent"},
  {include = "extensions", from = "backend/single-agent"},
  {include = "service", from = "backend/single-agent"},
  {include = "utils", from = "backend/single-agent"},
  {include = "data", from = "backend"},
  {include = "scheduling", from = "backend"},
  {include = "skill", from = "backend"},
  {include = "tool", from = "backend"},
]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
fastapi = "0.115.2"
uvicorn = "^0.31.1"
python-multipart = "^0.0.20"
pydantic = "^2.7.0"
python-dotenv = "^1.0.1"
sqlmodel = "^0.0.24"
sqlalchemy = "^2.0.0"
aiosqlite = "^0.21.0"
asyncpg = "^0.29.0"
aiomysql = "^0.3.2"
greenlet = "^3.3.1"
redis = "^6.2.0"
loguru = "^0.7.3"
httpx = {extras = ["socks"], version = "^0.28.1"}
aiohttp = "^3.9.0"
dnspython = "^2.7.0"
openai = "^1.0.0"
llama-index-core = "^0.14.8"
llama-index-llms-openai = "^0.6.10"
transformers = "4.51.3"
tiktoken = "^0.8.0"
cryptography = "^43.0.0"
pyyaml = "^6.0.2"
tenacity = "^8.5.0"
opentelemetry-api = "^1.33.0"
opentelemetry-sdk = "^1.33.0"
opentelemetry-exporter-otlp-proto-grpc = "^1.33.0"
opentelemetry-exporter-otlp-proto-http = "^1.33.0"
openinference-instrumentation-openai = "^0.1.18"
openinference-semantic-conventions = "^0.1.14"
langextract = "1.6.0"
pypdf = "^5.0.0"
psycopg = {extras = ["binary"], version = "^3.2.0"}
pydantic-settings = "^2.4.0"
python-docx = "^1.1.0"
numpy = "1.26.4"
pandas = "^2.2.0"
mistletoe = "1.5.1"
python-pptx = "1.0.2"
xlrd = "2.0.2"
openpyxl = "3.1.5"
matplotlib = "^3.9.0"
pip = "^25.0"
pytest = "^8.1.1"
pytest-asyncio = "^0.23.7"
pytest-cov = "^5.0.0"
playwright = "^1.60.0"
alibabacloud-green20220302 = "^3.3.0"
alibabacloud-tea-openapi = "^0.4.4"
llama-index-vector-stores-alibabacloud-opensearch = "^0.5.0"
# The speech SDK is installed separately in the container because its source
# archive is hosted on GitHub. Keep its runtime dependencies in the main lock.
aliyun-python-sdk-core = ">=2.13.3"
oss2 = "^2.19.1"

[tool.poetry.group.speech]
optional = true

[tool.poetry.group.speech.dependencies]
nls = {url = "https://github.com/aliyun/alibabacloud-nls-python-sdk/archive/177972b1f02fcb1f2b229e77320a7286d21785f3.tar.gz"}
